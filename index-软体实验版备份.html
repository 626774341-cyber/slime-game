<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>箱庭世界 · 3D 史莱姆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: #bfe4f7;
  }
  #c { display: block; width: 100%; height: 100%; touch-action: none; cursor: default; opacity: 0; transition: opacity 1.2s ease; }
  #c.ready { opacity: 1; }
  .card {
    position: fixed; background: rgba(255,255,255,.72); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border-radius: 16px;
    box-shadow: 0 8px 24px rgba(60,90,140,.15); color: #2c4a66; z-index: 5;
  }
  #title { top: 18px; left: 18px; padding: 12px 18px; animation: drop .8s ease both; }
  #title h1 { font-size: 20px; letter-spacing: 1px; }
  #title p { font-size: 12px; opacity: .75; margin-top: 3px; }
  #hints { bottom: 16px; left: 50%; transform: translateX(-50%); padding: 10px 12px;
           display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 62vw;
           animation: rise .8s .3s ease both; }
  #hints span { font-size: 12px; white-space: nowrap; background: rgba(255,255,255,.7);
                border-radius: 999px; padding: 5px 10px; }
  .iconbtn { width: 44px; height: 44px; display: flex; align-items: center;
          justify-content: center; font-size: 20px; cursor: pointer; user-select: none; }
  #mute { top: 18px; right: 18px; animation: drop .8s .1s ease both; }
  #nightBtn { top: 18px; right: 72px; animation: drop .8s .15s ease both; }
  #weatherBtn { top: 18px; right: 126px; animation: drop .8s .2s ease both; }
  #photoBtn { top: 18px; right: 180px; animation: drop .8s .25s ease both; }
  .iconbtn:hover { background: rgba(255,255,255,.92); }
  .card { transition: opacity .4s ease; }
  /* 拍照模式：隐藏所有界面（相机按钮除外） */
  body.photo .card:not(#photoBtn), body.photo #toast { opacity: 0; pointer-events: none; animation: none; }
  /* 右侧工具栏 */
  #toolbar { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column;
             gap: 10px; z-index: 6; animation: riseUp .8s .4s ease both; }
  .tool { position: static; width: 46px; height: 46px; font-size: 22px; border: none; cursor: pointer;
          display: flex; align-items: center; justify-content: center; transition: background .2s ease; }
  .tool.active { background: rgba(126,200,250,.95); box-shadow: 0 0 0 3px rgba(126,200,250,.35); }
  .tool:hover { background: rgba(255,255,255,.92); }
  .tool:active { transform: scale(.9); }
  /* 调色面板 */
  #palettePanel { position: fixed; right: 72px; bottom: 120px; padding: 10px; display: none;
                  gap: 8px; z-index: 7; }
  #palettePanel.open { display: flex; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff;
            cursor: pointer; box-shadow: 0 2px 6px rgba(60,90,140,.25); }
  .swatch:hover { transform: scale(1.15); }
  .swatch.rainbow { background: conic-gradient(#ff6b6b,#ffb56b,#ffe45e,#6bde7c,#5ec8ff,#b78aff,#ff6bd8,#ff6b6b); }
  /* 心情条 */
  #moodCard { bottom: 16px; left: 18px; padding: 10px 14px; display: flex; align-items: center;
              gap: 8px; animation: riseUp .8s .45s ease both; }
  #moodFace { font-size: 18px; }
  #moodBar { width: 110px; height: 10px; border-radius: 999px; background: rgba(120,150,180,.25);
             overflow: hidden; }
  #moodFill { height: 100%; width: 62%; border-radius: 999px; background: #5fd07a; transition: width .3s ease; }
  #moodLabel { font-size: 12px; opacity: .8; }
  /* 摘星挑战计分板 */
  #starHud { top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 20px;
             font-size: 15px; font-weight: 600; display: none; }
  #starHud.show { display: block; }
  /* 提示气泡 */
  #toast { position: fixed; bottom: 86px; left: 50%; transform: translate(-50%, 8px);
           background: rgba(35,58,82,.82); color: #fff; font-size: 13px; padding: 8px 18px;
           border-radius: 999px; opacity: 0; transition: all .35s ease; pointer-events: none;
           z-index: 8; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             flex-direction: column; gap: 16px; background: #bfe4f7; z-index: 10;
             transition: opacity .6s ease; color: #2c4a66; }
  #loading .ball { width: 46px; height: 40px; border-radius: 50% 50% 45% 45%;
             background: radial-gradient(circle at 32% 28%, #b8ecff, #3ec1ff 70%);
             box-shadow: 0 6px 16px rgba(46,150,220,.35); animation: squish 1s ease-in-out infinite; }
  #loading p { font-size: 14px; letter-spacing: 3px; }
  #loading.hide { opacity: 0; pointer-events: none; }
  @keyframes squish { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.15,.82); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translate(-50%,14px); } to { opacity: 1; transform: translate(-50%,0); } }
  @keyframes riseUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading"><div class="ball"></div><p>箱庭世界生成中…</p></div>
<canvas id="c"></canvas>

<div id="title" class="card">
  <h1>🫧 箱庭世界 · 3D 史莱姆</h1>
  <p>Three.js 互动加强版 · 人机交互小组作业</p>
  <p style="margin-top:4px;font-size:11px;">当前版本 <a href="https://github.com/626774341-cyber/slime-game/releases" target="_blank" rel="noopener" style="color:#2c4a66;text-decoration:underline;">v1.3 · 点看更新日志</a></p>
</div>
<div id="photoBtn" class="card iconbtn" title="拍照模式（隐藏界面 + 保存快照）">📷</div>
<div id="weatherBtn" class="card iconbtn" title="天气：晴 → 雨 → 雪">☔</div>
<div id="nightBtn" class="card iconbtn" title="昼夜切换">🌙</div>
<div id="mute" class="card iconbtn" title="切换音效">🔊</div>

<div id="hints" class="card">
  <span>🖐️ 拖动史莱姆</span>
  <span>👆 点一下戳戳</span>
  <span>🤚 长按抚摸</span>
  <span>🎯 点地跳过去</span>
  <span>🤸 蹦床 · 秋千 点着玩</span>
  <span>⌨️ 空格大跳 · B 跳舞</span>
  <span>🔄 拖空白转视角 · 🔍 缩放</span>
</div>

<div id="moodCard" class="card" title="史莱姆的心情">
  <span id="moodFace">😀</span>
  <div id="moodBar"><div id="moodFill"></div></div>
  <span id="moodLabel">心情</span>
</div>

<div id="starHud" class="card">⭐ 0 / 5</div>

<div id="toast"></div>

<div id="palettePanel" class="card">
  <div class="swatch" data-i="0" style="background:#54c8ff" title="天空蓝"></div>
  <div class="swatch" data-i="1" style="background:#63e06b" title="抹茶绿"></div>
  <div class="swatch" data-i="2" style="background:#ff9ed2" title="樱花粉"></div>
  <div class="swatch" data-i="3" style="background:#b78aff" title="葡萄紫"></div>
  <div class="swatch" data-i="4" style="background:#ffb05e" title="橘子橙"></div>
  <div class="swatch" data-i="5" style="background:#ffe45e" title="柠檬黄"></div>
  <div class="swatch rainbow" data-i="6" title="彩虹模式"></div>
</div>

<div id="toolbar">
  <button class="card tool" id="starBtn" title="⭐ 摘星挑战：收集 5 颗星星">⭐</button>
  <button class="card tool" id="shapeBtn" title="变形药水：换个形状">🧪</button>
  <button class="card tool" id="plantBtn" title="种花模式：点击地面种花">🌱</button>
  <button class="card tool" id="danceBtn" title="跳舞 (B 键)">💃</button>
  <button class="card tool" id="paletteBtn" title="换个颜色">🎨</button>
  <button class="card tool" id="hatBtn" title="换帽子">🎩</button>
  <button class="card tool" id="babyBtn" title="史莱姆宝宝（最多3只）">🥚</button>
  <button class="card tool" id="ballBtn" title="玩具球：史莱姆会自己追着踢">🏀</button>
  <button class="card tool" id="feedBtn" title="投喂苹果">🍎</button>
  <button class="card tool" id="chiliBtn" title="投喂辣椒（后果自负）">🌶️</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 小工具 ================= */
const { clamp, lerp } = THREE.MathUtils;
function lerpAngle(a, b, t) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  else if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
// 固定种子的伪随机数，保证每次打开场景布置一致
function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260917);
const GROUND_Y = 0.02;   // 草地表面高度
const BOUND = 4.3;       // 史莱姆可活动边界
const POND = { x: 2.3, z: -2.0, r: 1.15 }; // 池塘范围
function inPond(x, z) {
  const dx = x - POND.x, dz = z - POND.z;
  return dx * dx + dz * dz < POND.r * POND.r;
}

/* ================= v1.3 程序化贴图工厂（木纹 / 瓦片 / 灰泥 / 砖 / 草地 / 水面波光，零外部资源） ================= */
function makeCanvasTexture(draw, size = 512) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  draw(cv.getContext('2d'), size);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}
const texWood = makeCanvasTexture((ctx, s) => {
  ctx.fillStyle = '#9a6a45';
  ctx.fillRect(0, 0, s, s);
  for (let r = 0; r < 4; r++) {                 // 板条缝
    const y = r * s / 4;
    ctx.fillStyle = 'rgba(60,34,18,0.5)'; ctx.fillRect(0, y, s, 3);
    ctx.fillStyle = 'rgba(255,225,180,0.16)'; ctx.fillRect(0, y + 3, s, 2);
  }
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 70; i++) {                // 木纹
    ctx.strokeStyle = Math.random() < 0.5 ? 'rgba(70,42,22,0.15)' : 'rgba(255,220,170,0.10)';
    const y = Math.random() * s;
    ctx.beginPath(); ctx.moveTo(0, y);
    ctx.bezierCurveTo(s * 0.3, y + (Math.random() - 0.5) * 14, s * 0.7, y + (Math.random() - 0.5) * 14, s, y + (Math.random() - 0.5) * 8);
    ctx.stroke();
  }
  for (let i = 0; i < 3; i++) {                 // 节疤
    const x = Math.random() * s, y = Math.random() * s;
    const g = ctx.createRadialGradient(x, y, 1, x, y, 9);
    g.addColorStop(0, 'rgba(60,34,18,0.55)'); g.addColorStop(1, 'rgba(60,34,18,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill();
  }
});
texWood.repeat.set(3, 1);
const texPlaster = makeCanvasTexture((ctx, s) => {
  ctx.fillStyle = '#f7ecd8'; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = Math.random() < 0.5 ? 'rgba(150,120,80,0.05)' : 'rgba(255,255,255,0.06)';
    ctx.fillRect(Math.random() * s, Math.random() * s, 2, 2);
  }
}, 256);
const texShingle = makeCanvasTexture((ctx, s) => {
  ctx.fillStyle = '#a8492f'; ctx.fillRect(0, 0, s, s);
  const rows = 6, w = s / 5, h = s / rows;
  for (let r = 0; r < rows + 1; r++) {
    for (let c = -1; c < 6; c++) {
      const x = c * w + (r % 2) * w / 2, y = r * h;
      ctx.fillStyle = `hsl(${10 + Math.random() * 8},${46 + Math.random() * 10}%,${34 + Math.random() * 13}%)`;
      ctx.beginPath();
      ctx.moveTo(x + 3, y); ctx.lineTo(x + w - 3, y);
      ctx.lineTo(x + w - 3, y + h * 0.72);
      ctx.quadraticCurveTo(x + w / 2, y + h * 0.96, x + 3, y + h * 0.72);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(60,20,10,0.4)'; ctx.lineWidth = 2; ctx.stroke();
    }
  }
});
const texBrick = makeCanvasTexture((ctx, s) => {
  ctx.fillStyle = '#c9b29a'; ctx.fillRect(0, 0, s, s);
  const bw = s / 5, bh = s / 8;
  for (let r = 0; r < 8; r++) {
    for (let c = -1; c < 6; c++) {
      const x = c * bw + (r % 2) * bw / 2, y = r * bh;
      ctx.fillStyle = `hsl(${12 + Math.random() * 8},${34 + Math.random() * 12}%,${38 + Math.random() * 10}%)`;
      ctx.fillRect(x + 2, y + 2, bw - 4, bh - 4);
    }
  }
}, 256);
const texGrass = makeCanvasTexture((ctx, s) => {
  ctx.fillStyle = '#7cbd52'; ctx.fillRect(0, 0, s, s);
  ctx.fillStyle = 'rgba(255,255,255,0.055)';
  for (let i = 0; i < 4; i++) {                 // 割草条纹
    ctx.save(); ctx.translate(i * s / 2, 0); ctx.rotate(0.35); ctx.fillRect(0, -s, s / 4, s * 3); ctx.restore();
  }
  for (let i = 0; i < 2400; i++) {              // 草叶噪点
    ctx.fillStyle = Math.random() < 0.5 ? 'rgba(56,110,38,0.16)' : 'rgba(196,232,130,0.14)';
    ctx.fillRect(Math.random() * s, Math.random() * s, 2, 2);
  }
  for (let i = 0; i < 6; i++) {                 // 深浅斑块
    const x = Math.random() * s, y = Math.random() * s, r = 40 + Math.random() * 70;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(50,100,35,0.10)'); g.addColorStop(1, 'rgba(50,100,35,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
});
texGrass.repeat.set(2, 2);
const texCaustic = makeCanvasTexture((ctx, s) => {
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 3;
  ctx.shadowColor = 'rgba(255,255,255,0.9)';
  ctx.shadowBlur = 6;
  for (let i = 0; i < 15; i++) {
    const y = Math.random() * s;
    ctx.beginPath(); ctx.moveTo(0, y);
    ctx.bezierCurveTo(s * 0.3, y - 16, s * 0.6, y + 16, s, y);
    ctx.stroke();
  }
}, 256);
texCaustic.repeat.set(3, 3);

/* ================= 渲染器 / 场景 / 相机 ================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe4f7);
scene.fog = new THREE.Fog(0xbfe4f7, 20, 42);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);
camera.position.set(7.5, 6.2, 11);

// 环境反射：让半透明的果冻材质有高光层次
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.06).texture;
scene.environmentIntensity = 0.55;
pmrem.dispose();

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 4.5;
controls.maxDistance = 20;
controls.minPolarAngle = 0.18;
controls.maxPolarAngle = 1.42;

/* ================= 灯光 ================= */
const sun = new THREE.DirectionalLight(0xfff1dc, 2.3);
sun.position.set(6, 10, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
sun.shadow.camera.top = 9;   sun.shadow.camera.bottom = -9;
sun.shadow.camera.near = 2;  sun.shadow.camera.far = 30;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0xa08a6a, 0.6);
scene.add(hemi);
// 月光（夜晚淡入）
const moonLight = new THREE.DirectionalLight(0x9db8ff, 0);
moonLight.position.set(-10, 12, -8);
scene.add(moonLight);

/* ================= 箱庭世界（微缩景观） ================= */
const world = new THREE.Group();
scene.add(world);

const matWood  = new THREE.MeshStandardMaterial({ map: texWood, roughness: 0.85 });
const matGrass = new THREE.MeshStandardMaterial({ color: 0x82c95e, roughness: 0.95 });
const matSoil  = new THREE.MeshStandardMaterial({ color: 0x8a6b4a, roughness: 1 });
const matTrunk = new THREE.MeshStandardMaterial({ color: 0x8a5a3a, roughness: 0.9 });
const matLeafA = new THREE.MeshStandardMaterial({ color: 0x5fb85a, roughness: 0.9, flatShading: true });
const matLeafB = new THREE.MeshStandardMaterial({ color: 0x4da34f, roughness: 0.9, flatShading: true });
const matLeafC = new THREE.MeshStandardMaterial({ color: 0x6fca66, roughness: 0.9, flatShading: true });
const matRock  = new THREE.MeshStandardMaterial({ color: 0xb9b9c0, roughness: 0.9, flatShading: true });
const matSand  = new THREE.MeshStandardMaterial({ color: 0xe6d29a, roughness: 1 });
const matPond  = new THREE.MeshStandardMaterial({ color: 0x59c2e8, roughness: 0.12, metalness: 0.05 });
const matCloud = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
// v1.3 建筑材质
const matWoodDark = new THREE.MeshStandardMaterial({ color: 0x6e4a2e, roughness: 0.85 });
const matPlaster  = new THREE.MeshStandardMaterial({ map: texPlaster, roughness: 0.95 });
const matShingle  = new THREE.MeshStandardMaterial({ map: texShingle, roughness: 0.8 });
const matBrick    = new THREE.MeshStandardMaterial({ map: texBrick, roughness: 0.9 });
const matGold     = new THREE.MeshStandardMaterial({ color: 0xd8a437, metalness: 0.7, roughness: 0.3 });
const matReed     = new THREE.MeshStandardMaterial({ color: 0x5a8f3e, roughness: 1 });

// 木质底座（木纹）+ 草地台面（土壤侧面 + 带纹理草皮）
const baseBox = new THREE.Mesh(new THREE.BoxGeometry(10.5, 1.1, 10.5), matWood);
baseBox.position.y = -0.57;
baseBox.receiveShadow = true;
world.add(baseBox);

const grassTop = new THREE.Mesh(new THREE.BoxGeometry(10, 0.24, 10), matSoil);
grassTop.position.y = -0.11;
grassTop.receiveShadow = true;
world.add(grassTop);
const grassPlane = new THREE.Mesh(new THREE.PlaneGeometry(10, 10),
  new THREE.MeshStandardMaterial({ map: texGrass, roughness: 1 }));
grassPlane.rotation.x = -Math.PI / 2;
grassPlane.position.y = 0.012;
grassPlane.receiveShadow = true;
world.add(grassPlane);

// 小池塘 v1.3（沙滩 + 水面 + 波光 + 荷叶 + 香蒲 + 石圈）
const pondSand = new THREE.Mesh(new THREE.CircleGeometry(1.5, 40), matSand);
pondSand.rotation.x = -Math.PI / 2;
pondSand.position.set(POND.x, 0.015, POND.z);
pondSand.receiveShadow = true;
world.add(pondSand);
const pond = new THREE.Mesh(new THREE.CircleGeometry(1.25, 40), matPond);
pond.rotation.x = -Math.PI / 2;
pond.position.set(POND.x, 0.022, POND.z);
world.add(pond);
const pondGlints = new THREE.Mesh(new THREE.CircleGeometry(1.23, 40),
  new THREE.MeshBasicMaterial({ map: texCaustic, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false }));
pondGlints.rotation.x = -Math.PI / 2;
pondGlints.position.set(POND.x, 0.027, POND.z);
world.add(pondGlints);
for (let i = 0; i < 12; i++) {                   // 池边石圈
  const a = i / 12 * Math.PI * 2 + rand() * 0.25;
  const st = new THREE.Mesh(new THREE.IcosahedronGeometry(0.09 + rand() * 0.06, 0), matRock);
  st.position.set(POND.x + Math.cos(a) * 1.38, 0.045, POND.z + Math.sin(a) * 1.38);
  st.rotation.set(rand() * 3, rand() * 3, rand() * 3);
  st.castShadow = true;

function updateSwing(dt, t) {
  swing.pushCd -= dt;
  swing.jigCd -= dt;
  const acc = -(9.8 / SWING.L) * Math.sin(swing.angle);
  if (swing.mounted) {
    // 荡秋千：到底部时“荡一下”补能量，越荡越高
    swing.pumpT -= dt;
    swing.vel += (acc - 0.3 * swing.vel) * dt;
    if (Math.abs(swing.angle) < 0.12 && swing.pumpT <= 0 && Math.abs(swing.vel) > 0.4) {
      swing.pumpT = 0.55;
      swing.vel += Math.sign(swing.vel) * 0.5;
      if (Math.random() < 0.35) spawnNote();
      blip(500 + Math.random() * 120, 860, 0.08, 0.045);
    }
  } else {
    // 空秋千：慢慢摆回静止
    swing.vel += (acc - 0.55 * swing.vel) * dt;
  }
  swing.angle = clamp(swing.angle + swing.vel * dt, -1.1, 1.1);
  swing.arm.rotation.x = swing.angle;
  // 蹦床垫子：柔和下陷 + 回弹（弹簧）
  springUpdate(tramp.sag, 130, 7, dt);

let smokeT = 0.6;
function updateSmoke(dt, t) {
  if (!smokeAnchor) return;
  smokeT -= dt;
  if (smokeT <= 0) {
    smokeT = 0.7;
    const it = smokePool.find(s => s.life < 0);
    if (it) {
      it.life = 0;
      smokeAnchor.getWorldPosition(it.sp.position);
      it.sp.visible = true;
    }
  }
  for (const it of smokePool) {
    if (it.life < 0) continue;
    it.life += dt / 3.4;
    if (it.life >= 1) { it.life = -1; it.sp.visible = false; continue; }
    it.sp.position.y += 0.32 * dt;
    it.sp.position.x += (0.09 + Math.sin(t + it.drift) * 0.03) * dt;
    const s = 0.14 + it.life * 0.55;
    it.sp.scale.set(s, s, 1);
    it.sp.material.opacity = 0.4 * Math.sin(Math.min(1, it.life * 3) * Math.PI * 0.5) * (1 - it.life);
  }
}

const SNOW_N = 240;

for (let i = 0; i < SNOW_N; i++) {
  snowFlakes.push({ x: (Math.random() * 2 - 1) * 5, y: Math.random() * 8, z: (Math.random() * 2 - 1) * 5, ph: Math.random() * 10 });
}
const snowGeo = new THREE.BufferGeometry();

function updateWeatherFx(dt, t) {
  weather.rainAmt += ((weather.mode === 1 ? 1 : 0) - weather.rainAmt) * Math.min(1, dt * 1.2);
  weather.snowAmt += ((weather.mode === 2 ? 1 : 0) - weather.snowAmt) * Math.min(1, dt * 1.2);
  const dn = dnState.v;
  if (weather.rainAmt > 0.01) {
    for (let i = 0; i < RAIN_N; i++) {
      const d = rainDrops[i];
      d.y -= 13 * dt;
      if (d.y < 0) { d.y = 6 + Math.random() * 2.5; d.x = (Math.random() * 2 - 1) * 5; d.z = (Math.random() * 2 - 1) * 5; }
      const o = i * 6;
      rainPos[o] = d.x; rainPos[o + 1] = d.y; rainPos[o + 2] = d.z;
      rainPos[o + 3] = d.x; rainPos[o + 4] = d.y - 0.26; rainPos[o + 5] = d.z;
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  rainMat.opacity = weather.rainAmt * (0.3 + 0.15 * dn);
  if (weather.snowAmt > 0.01) {
    for (let i = 0; i < SNOW_N; i++) {
      const f = snowFlakes[i];
      f.y -= 0.9 * dt;
      f.x += Math.sin(t * 0.8 + f.ph) * 0.18 * dt;
      if (f.y < 0) { f.y = 6 + Math.random() * 2.5; f.x = (Math.random() * 2 - 1) * 5; f.z = (Math.random() * 2 - 1) * 5; }
      const o = i * 3;
      snowPos[o] = f.x; snowPos[o + 1] = f.y; snowPos[o + 2] = f.z;
    }
    snowGeo.attributes.position.needsUpdate = true;
  }
  snowMat.opacity = weather.snowAmt * 0.9;
  // 雨点落地涟漪
  weather.rippleT -= dt;
  if (weather.rainAmt > 0.6 && weather.rippleT <= 0) {
    weather.rippleT = 0.12;
    spawnRipple((Math.random() * 2 - 1) * 4.4, (Math.random() * 2 - 1) * 4.4, 0.2);
  }
  // 云变暗 + 雨声（静音时不响）
  const cl = 1 - 0.4 * weather.rainAmt - 0.12 * weather.snowAmt;
  matCloud.color.setRGB(cl, cl, Math.min(1, cl + 0.03));
  if (actx && rainGain) rainGain.gain.value = muted ? 0 : weather.rainAmt * 0.05;
}

// —— 变形药水：圆滚滚 / 小方块 / 甜甜圈 / 布丁 ——
const SHAPE_NAMES = ['圆滚滚', '小方块', '甜甜圈', '布丁'];
let slimeShapeIdx = 0;
const shapeCache = {};
function getShapeGeo(i) {
  if (shapeCache[i]) return shapeCache[i];
  let g;
  if (i === 1) {                                    // 小方块
    g = new THREE.BoxGeometry(1.56, 1.56, 1.56, 3, 3, 3);
    g.translate(0, 0.1075, 0);                      // 底部对齐 -0.6725
    g.computeVertexNormals();
  } else if (i === 2) {                             // 甜甜圈
    g = new THREE.TorusGeometry(0.95, 0.52, 14, 28);
    g.rotateX(Math.PI / 2);
    g.translate(0, -0.1525, 0);
    g.computeVertexNormals();
  } else if (i === 3) {                             // 布丁
    const pts = [
      new THREE.Vector2(0.001, 0),
      new THREE.Vector2(0.72, 0),
      new THREE.Vector2(0.95, 0.26),
      new THREE.Vector2(0.82, 0.6),
      new THREE.Vector2(0.32, 0.9),
      new THREE.Vector2(0.001, 0.99),
    ];
    g = new THREE.LatheGeometry(pts, 26);
    g.scale(1.05, 1.42, 1.05);
    g.translate(0, -0.6725, 0);
    g.computeVertexNormals();
  } else {
    g = slimeGeoMerged;                             // 圆滚滚
  }
  shapeCache[i] = g;
  return g;
}
function cycleShape() {
  ensureAudio();
  slimeShapeIdx = (slimeShapeIdx + 1) % SHAPE_NAMES.length;
  const g = getShapeGeo(slimeShapeIdx);
  slimeMesh.geometry = g;
  basePos = Float32Array.from(g.attributes.position.array);
  baseNor = Float32Array.from(g.attributes.normal.array);
  spawnSparkles(6);
  say('变——！');
  toast('🧪 变成了' + SHAPE_NAMES[slimeShapeIdx]);
  blip(260 + slimeShapeIdx * 90, 900, 0.18, 0.12);
}

        f.g.rotation.y = Math.atan2(f.p1.x - f.p0.x, f.p1.z - f.p0.z);

function makePool(n, factory) {
  const arr = [];
  for (let i = 0; i < n; i++) {
    const it = factory(i);
    it.mesh.visible = false;
    scene.add(it.mesh);
    arr.push(it);
  }
  return arr;
}
function poolGet(pool) {
  for (const it of pool) if (!it.mesh.visible) return it;
  return null;
}
function updateFloatPool(pool, dt) {
  for (const it of pool) {
    if (!it.mesh.visible) continue;
    it.life += dt / it.dur;
    if (it.life >= 1) { it.mesh.visible = false; continue; }
    it.vel.y -= it.grav * dt;
    it.mesh.position.addScaledVector(it.vel, dt);
    if (it.spin) {
      it.mesh.rotation.x += it.spin * dt;
      it.mesh.rotation.y += it.spin * 0.6 * dt;
    }
    const k = it.grow ? (0.55 + it.life * 0.75) : Math.max(0.05, 1 - it.life);
    it.mesh.scale.setScalar(it.baseS * k);
    if (it.mesh.material) it.mesh.material.opacity = 1 - it.life;
  }
}

function makeBubbleSprite() {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 128;
  const ctx = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  function redraw(text) {
    ctx.clearRect(0, 0, 256, 128);
    ctx.fillStyle = 'rgba(255,255,255,0.96)';
    ctx.strokeStyle = 'rgba(80,120,160,0.9)';
    ctx.lineWidth = 5;
    const r = 32;
    ctx.beginPath();
    ctx.moveTo(30 + r, 14);
    ctx.arcTo(226, 14, 226, 86, r);
    ctx.arcTo(226, 86, 30, 86, r);
    ctx.arcTo(30, 86, 30, 14, r);
    ctx.arcTo(30, 14, 226, 14, r);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 小尾巴
    ctx.beginPath();
    ctx.moveTo(116, 84);
    ctx.lineTo(128, 116);
    ctx.lineTo(142, 84);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillRect(118, 78, 22, 8);
    // 文字
    ctx.fillStyle = '#2c4a66';
    ctx.font = 'bold 34px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 128, 50);
    tex.needsUpdate = true;
  }
  return { sp: sp, redraw: redraw };
}

/* ================= 音效（Web Audio 合成，无外部资源） ================= */
let actx = null, muted = false, keepAlive = null, rainGain = null;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    // 静音保活振荡器：让浏览器认为页面在播放声音，
    // 页面切到后台时定时器不被强节流，动画继续运行
    if (!keepAlive) {
      keepAlive = actx.createOscillator();
      const kg = actx.createGain();
      kg.gain.value = 0.0015;
      keepAlive.frequency.value = 40;
      keepAlive.connect(kg).connect(actx.destination);
      keepAlive.start();
    }
    // 雨声循环（白噪声 + 低通），音量由天气系统控制
    if (!rainGain) {
      const len = Math.floor(actx.sampleRate * 1.2);
      const buf = actx.createBuffer(1, len, actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = actx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      const f = actx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 900;
      rainGain = actx.createGain();
      rainGain.gain.value = 0;
      src.connect(f).connect(rainGain).connect(actx.destination);
      src.start();
    }
  } catch (e) { /* 无音频环境时静默失败 */ }
}
function blip(f0, f1, dur, vol, delay = 0) {
  if (muted || !actx) return;
  try {
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) { /* ignore */ }
}
function splashSound() {
  if (muted || !actx) return;
  try {
    const dur = 0.3;
    const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = actx.createBufferSource();
    src.buffer = buf;
    const f = actx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.8;
    const g = actx.createGain();
    g.gain.value = 0.25;
    src.connect(f).connect(g).connect(actx.destination);
    src.start();
  } catch (e) { /* ignore */ }
}

function computeHopLeg() {
  const H = slime.hop;
  const dx = H.target.x - slime.pos.x;
  const dz = H.target.z - slime.pos.z;
  const dist = Math.hypot(dx, dz);
  if (dist < 0.18) { H.done = true; return; }
  const leg = Math.min(1.15, dist);
  H.from.copy(slime.pos);
  H.to.set(slime.pos.x + dx / dist * leg, GROUND_Y, slime.pos.z + dz / dist * leg);
  H.h = 0.5 + 0.3 * (leg / 1.15);
  H.t = 0;
  slime.sq.v -= 2.6;
  blip(170 + H.i * 35, 330, 0.09, 0.08);
}
function startHops(target) {
  if (slime.mode !== 'free' || slime.pos.y > 0.6 || slime.danceT > 0 || pet.active) return;
  const d = Math.hypot(target.x - slime.pos.x, target.z - slime.pos.z);
  if (d < 0.35) return;
  slime.mode = 'hop';
  const H = slime.hop;
  H.target.set(clamp(target.x, -BOUND, BOUND), GROUND_Y, clamp(target.z, -BOUND, BOUND));
  H.count = clamp(Math.ceil(d / 1.15), 1, 4);
  H.i = 0;
  H.done = false;
  computeHopLeg();
}

      f.vel.x *= Math.exp(-4 * dt);

    f.g.rotation.x += f.vel.z * dt * 1.5;

    followT: 0, blinkT: -1, nextBlink: 1 + Math.random() * 3,
    leader: null
  };
  b.prev.copy(b.pos);
  g.position.copy(b.pos);
  scene.add(g);
  babies.push(b);
  rewireLeaders();
  return b;
}
function rewireLeaders() {
  babies.forEach((b, i) => { b.leader = (i === 0) ? slime : babies[i - 1]; });
}
function toggleBaby() {
  ensureAudio();
  if (babies.length >= 3) {
    babies.forEach(b => scene.remove(b.g));
    babies.length = 0;
    toast('宝宝们回家啦～');
    blip(500, 220, 0.2, 0.1);
  } else {
    spawnBaby();
    toast('🥚 史莱姆宝宝出现啦！');
    if (babies.length >= 3) achUnlockNow('baby3');
    blip(600, 980, 0.14, 0.12);
  }
}
function pokeBaby(b) {
  b.vel.y = 4.2;
  b.sq.v -= 2.4;
  spawnDebris(new THREE.Vector3(b.pos.x, b.pos.y + 0.5, b.pos.z), 3, SPARKLE_COLORS, 5);
  blip(520, 950, 0.1, 0.1);
}
function grabBaby(b) {
  b.mode = 'grab';
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.ray.intersectPlane(dragPlane, _v)) {
    b.target.set(clamp(_v.x, -BOUND, BOUND), 0.85, clamp(_v.z, -BOUND, BOUND));
  }
  blip(430, 700, 0.08, 0.08);
}
function releaseBaby(b) {
  b.mode = 'free';
  b.vel.x = clamp(b.vel.x, -6, 6);
  b.vel.z = clamp(b.vel.z, -6, 6);
  b.vel.y = clamp(b.vel.y, -2, 4) * 0.6 + 0.9;
  blip(380, 200, 0.14, 0.09);
}
function updateBabies(dt, t) {
  for (const b of babies) {
    b.prev.copy(b.pos);
    if (b.mode === 'grab') {
      b.vel.x += ((b.target.x - b.pos.x) * 90 - b.vel.x * 11) * dt;
      b.vel.z += ((b.target.z - b.pos.z) * 90 - b.vel.z * 11) * dt;
      const hoverY = 0.85 + Math.sin(t * 3 + 1) * 0.05;
      b.vel.y += ((hoverY - b.pos.y) * 80 - b.vel.y * 9) * dt;
      b.pos.addScaledVector(b.vel, dt);
      b.pos.x = clamp(b.pos.x, -BOUND, BOUND);
      b.pos.z = clamp(b.pos.z, -BOUND, BOUND);
    } else {
      b.vel.y -= 26 * dt;
      b.pos.addScaledVector(b.vel, dt);
      if (b.pos.y <= GROUND_Y) {
        b.pos.y = GROUND_Y;
        const iv = -b.vel.y;
        if (iv > 1.2) { b.vel.y = iv * 0.32; b.sq.v += Math.min(5, iv * 0.9); if (iv > 3) spawnRipple(b.pos.x, b.pos.z, 0.4); }
        else { b.vel.y = 0; b.vel.x *= Math.exp(-6 * dt); b.vel.z *= Math.exp(-6 * dt); }
      }
      for (const ax of ['x', 'z']) {
        if (Math.abs(b.pos[ax]) > BOUND) {
          b.pos[ax] = Math.sign(b.pos[ax]) * BOUND;
          b.vel[ax] *= -0.45;
        }
      }
      // 跟随领队（排成小尾巴）
      const L = b.leader;
      if (L) {
        const dx = b.pos.x - L.pos.x, dz = b.pos.z - L.pos.z;
        const d = Math.hypot(dx, dz);
        b.followT -= dt;
        if (d > 0.95 && b.pos.y <= GROUND_Y + 0.01 && b.followT <= 0) {
          b.followT = 0.3;
          const sp = 2.4 + Math.min(d * 0.8, 2);
          b.vel.x = -dx / d * sp;
          b.vel.z = -dz / d * sp;
          b.vel.y = 4.4;
          b.sq.v -= 2;
          if (t - lastBabyBlip > 0.15) { lastBabyBlip = t; blip(480 + Math.random() * 160, 760, 0.07, 0.05); }
        }
      }
    }
    b.effVel.subVectors(b.pos, b.prev).divideScalar(Math.max(dt, 1e-4));
    springUpdate(b.sq, 170, 11, dt);
    b.sq.x = clamp(b.sq.x, -0.35, 0.55);
    const tlx = clamp(-b.effVel.x * 0.04, -0.2, 0.2);
    const tlz = clamp(-b.effVel.z * 0.04, -0.2, 0.2);
    b.lean.x += (tlx - b.lean.x) * (1 - Math.exp(-9 * dt));
    b.lean.z += (tlz - b.lean.z) * (1 - Math.exp(-9 * dt));
    const spd = Math.hypot(b.effVel.x, b.effVel.z);
    const targetYaw = spd > 0.8 ? Math.atan2(b.effVel.x, b.effVel.z) : b.yaw;
    b.yaw = lerpAngle(b.yaw, targetYaw, 1 - Math.exp(-8 * dt));
    const breath = Math.sin(t * 3 + b.pos.x);
    b.g.position.copy(b.pos);
    b.g.rotation.y = b.yaw;
    b.g.scale.set(
      Math.max(0.5, (1 + 0.62 * b.sq.x) * (1 - 0.01 * breath)),
      Math.max(0.45, (1 - 0.85 * b.sq.x) * (1 + 0.02 * breath)),
      Math.max(0.5, (1 + 0.62 * b.sq.x) * (1 - 0.01 * breath))
    );
    // 眨眼 + 夜晚犯困
    if (t > b.nextBlink) { b.blinkT = 0; b.nextBlink = t + 2.5 + Math.random() * 3.5; }
    let ey = 1 - dnState.v * 0.45;
    if (b.blinkT >= 0) {
      b.blinkT += dt;
      const ph = b.blinkT / 0.22;
      if (ph >= 1) b.blinkT = -1;
      else ey *= Math.max(0.08, 1 - 0.95 * Math.sin(ph * Math.PI));
    }
    b.eyeL.scale.y = ey;
    b.eyeR.scale.y = ey;
  }
}

/* ================= 蝴蝶 / 萤火虫更新 ================= */
function updateButterflies(dt, t) {
  for (const bf of butterflies) {
    bf.px = bf.g.position.x;
    bf.pz = bf.g.position.z;
    if (bf.dartT > 0) {
      bf.dartT -= dt;
      bf.g.position.addScaledVector(bf.dartDir, 3.2 * dt);
      bf.lp.rotation.z = Math.sin(t * 40) * 1.1;
      bf.rp.rotation.z = -bf.lp.rotation.z;
      if (bf.dartT <= 0) {
        bf.center.set(bf.g.position.x, 0, bf.g.position.z);
        bf.phase = Math.random() * 10;
      }
    } else {
      const s = bf.speed;
      const px = bf.center.x + Math.sin(t * 0.33 * s + bf.phase) * 1.5;
      const pz = bf.center.z + Math.cos(t * 0.27 * s + bf.phase * 1.3) * 1.5;
      const py = 0.75 + Math.sin(t * 1.1 + bf.phase) * 0.3;
      bf.g.position.set(px, py, pz);
      const flap = Math.sin(t * 11 + bf.phase) * 0.95;
      bf.lp.rotation.z = flap;
      bf.rp.rotation.z = -flap;
    }
    const dx = bf.g.position.x - bf.px, dz = bf.g.position.z - bf.pz;
    if (Math.abs(dx) + Math.abs(dz) > 1e-4) {
      bf.g.rotation.y = lerpAngle(bf.g.rotation.y, Math.atan2(dx, dz), 1 - Math.exp(-6 * dt));
    }
  }
}
function dartButterfly(bf) {
  raycaster.setFromCamera(ndc, camera);
  const d = new THREE.Vector3(raycaster.ray.direction.x, 0, raycaster.ray.direction.z);
  if (d.lengthSq() < 1e-4) d.set(Math.random() - 0.5, 0, Math.random() - 0.5);
  d.normalize();
  bf.dartDir.copy(d);
  bf.dartT = 0.9;
  blip(700, 1250, 0.08, 0.06);
}
function updateFireflies(t) {
  const dn = dnState.v;
  for (const fl of fireflies) {
    const x = fl.cx + Math.sin(t * fl.s1 + fl.ph1) * fl.r;
    const z = fl.cz + Math.cos(t * fl.s2 + fl.ph2) * fl.r;
    const y = fl.h + Math.sin(t * 1.3 + fl.ph2) * 0.2;
    fl.mesh.position.set(x, y, z);
    fl.mesh.material.opacity = dn * (0.25 + 0.75 * Math.pow(Math.max(0, Math.sin(t * 1.8 + fl.ph1 * 3)), 2));
  }
}

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2(-10, -10);
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);        // y = 0
const dragPlane   = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.9);     // y = 0.9
const eyePlane    = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.6);     // y = 0.6
const hitSphere   = new THREE.Sphere(new THREE.Vector3(), 1.05);
const _v = new THREE.Vector3();

const drag = { active: false, moved: false, kind: 'none', obj: null, x: 0, y: 0, t0: 0, id: -1 };

function updateNdc(e) {
  ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
}
function pickTarget() {
  raycaster.setFromCamera(ndc, camera);
  hitSphere.radius = 1.05;
  hitSphere.center.set(slime.pos.x, slime.pos.y + 0.72, slime.pos.z);
  if (raycaster.ray.intersectsSphere(hitSphere)) return { kind: 'slime', obj: null };
  for (const b of babies) {
    hitSphere.radius = 0.55;
    hitSphere.center.set(b.pos.x, b.pos.y + 0.35, b.pos.z);
    if (raycaster.ray.intersectsSphere(hitSphere)) return { kind: 'baby', obj: b };
  }
  if (ball) {
    hitSphere.radius = 0.38;
    hitSphere.center.copy(ball.pos);
    if (raycaster.ray.intersectsSphere(hitSphere)) return { kind: 'ball', obj: ball };
  }
  for (const f of foods) {
    if (f.eaten) continue;
    hitSphere.radius = 0.35;
    hitSphere.center.copy(f.pos);
    if (raycaster.ray.intersectsSphere(hitSphere)) return { kind: 'apple', obj: f };
  }
  // v1.2: 秋千（没坐上去时可以点它）
  if (!swing.mounted) {
    swing.seat.getWorldPosition(_seatPos);
    hitSphere.radius = 0.55;
    hitSphere.center.copy(_seatPos);
    if (raycaster.ray.intersectsSphere(hitSphere)) return { kind: 'swing', obj: null };
  }
  for (const bf of butterflies) {
    hitSphere.radius = 0.3;
    hitSphere.center.copy(bf.g.position);
    if (raycaster.ray.intersectsSphere(hitSphere)) return { kind: 'butterfly', obj: bf };
  }
  return { kind: 'none', obj: null };
}

// 用 window 捕获阶段接管事件：点到史莱姆等目标时阻止 OrbitControls
window.addEventListener('pointerdown', (e) => {
  if (e.target !== canvas) return;
  ensureAudio();
  slime.wanderT = 9;   // 玩家在互动，先别自己乱跑
  updateNdc(e);
  const hit = pickTarget();
  drag.active = true; drag.moved = false;
  drag.kind = hit.kind; drag.obj = hit.obj;
  drag.x = e.clientX; drag.y = e.clientY; drag.t0 = performance.now(); drag.id = e.pointerId;
  if (hit.kind === 'apple') grabApple(hit.obj);
  if (hit.kind === 'ball') grabBall(hit.obj);
  if (hit.kind !== 'none') e.stopPropagation();
  // slime / baby：先挂起，等移动(抓起)或长按(抚摸)再决定
}, true);

window.addEventListener('pointermove', (e) => {
  updateNdc(e);
  if (!drag.active || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 7) {
    drag.moved = true;
    if (pet.active) pet.active = false;
    if (drag.kind === 'slime' && slime.mode === 'free') grabSlime();
    if (drag.kind === 'baby' && drag.obj && drag.obj.mode !== 'grab') grabBaby(drag.obj);
  }
  if (drag.kind === 'slime' && slime.mode === 'grab') {
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(slimeDragPlane, _v)) {
      slime.grabTarget.set(clamp(_v.x, -BOUND, BOUND), clamp(_v.y, 0.45, 2.6), clamp(_v.z, -BOUND, BOUND));
    }
  } else if (drag.kind === 'baby' && drag.obj && drag.obj.mode === 'grab') {
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(dragPlane, _v)) {
      drag.obj.target.set(clamp(_v.x, -BOUND, BOUND), 0.85, clamp(_v.z, -BOUND, BOUND));
    }
  } else if (drag.kind === 'apple' && drag.obj && drag.obj.mode === 'grab') {
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(dragPlane, _v)) {
      drag.obj.target.set(clamp(_v.x, -BOUND, BOUND), 0.5, clamp(_v.z, -BOUND, BOUND));
    }
  } else if (drag.kind === 'ball' && drag.obj && drag.obj.mode === 'grab') {
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(dragPlane, _v)) {
      drag.obj.target.set(clamp(_v.x, -BOUND, BOUND), 0.5, clamp(_v.z, -BOUND, BOUND));
    }
  }
}, true);

window.addEventListener('pointerup', (e) => {
  if (!drag.active || e.pointerId !== drag.id) return;
  const quick = performance.now() - drag.t0 < 300;
  const k = drag.kind;
  if (k === 'slime') {
    pet.active = false;
    if (slime.mode === 'grab') {
      if (!drag.moved && quick) pokeSlime();
      else releaseSlime();
    } else if (!drag.moved && quick) {
      pokeSlime();
    }
  } else if (k === 'baby' && drag.obj) {
    const b = drag.obj;
    if (b.mode === 'grab') releaseBaby(b);
    else if (!drag.moved && quick) pokeBaby(b);
  } else if (k === 'apple' && drag.obj) {
    drag.obj.mode = 'free';
    blip(400, 260, 0.08, 0.06);
  } else if (k === 'ball' && drag.obj) {
    drag.obj.mode = 'free';
    blip(400, 260, 0.08, 0.06);
  } else if (k === 'butterfly' && drag.obj) {
    if (!drag.moved && quick) dartButterfly(drag.obj);
  } else if (k === 'swing') {
    // v1.2: 点秋千——没坐就过去坐；坐着就推一把
    if (!drag.moved && quick) {
      if (slime.mode === 'swing') {
        if (swing.pushCd <= 0) {
          swing.pushCd = 0.3;
          swing.vel += (swing.vel >= 0 ? 1 : -1) * 1.2;
          mood.happy = Math.min(100, mood.happy + 2);
          blip(460, 800, 0.1, 0.09);
        }
      } else {
        pendingFacility = 'swing';
        startHops(new THREE.Vector3(SWING.x, GROUND_Y, SWING.z));
        toast('🎯 过去坐秋千咯～');
        blip(600, 900, 0.1, 0.09);
      }
    }
  } else if (k === 'none') {
    if (!drag.moved && quick) {
      raycaster.setFromCamera(ndc, camera);
      if (raycaster.ray.intersectPlane(groundPlane, _v)) {
        if (inPond(_v.x, _v.z)) fishJump();
        if (plantMode) plantFlower(_v.x, _v.z);
        else {
          if (slime.mode === 'swing') { endSwing(); toast('跳下来啦！'); }
          startHops(_v);
        }
      }
    }
  }
  drag.active = false; drag.kind = 'none'; drag.obj = null; drag.id = -1;
  canvas.style.cursor = 'default';
}, true);

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// 键盘：空格 = 超级跳，B = 跳舞，Esc = 退出拍照模式

/* ================= 每帧更新：史莱姆 ================= */
const DANCE_NOTES = [523, 659, 784, 1047];
function updateSlime(dt, t) {
  const S = slime;
  S.prev.copy(S.pos);
  S.hopCooldown -= dt;

  if (S.mode === 'grab') {
    // 弹簧跟随指针：滞后 + 回弹，天然带出手感
    S.vel.x += ((S.grabTarget.x - S.pos.x) * 90 - S.vel.x * 11) * dt;
    S.vel.z += ((S.grabTarget.z - S.pos.z) * 90 - S.vel.z * 11) * dt;
    const hoverY = 0.95 + Math.sin(t * 3) * 0.06;
    S.vel.y += ((hoverY - S.pos.y) * 80 - S.vel.y * 9) * dt;
    S.pos.addScaledVector(S.vel, dt);
    S.pos.x = clamp(S.pos.x, -BOUND, BOUND);
    S.pos.z = clamp(S.pos.z, -BOUND, BOUND);
    S.wob1.v += Math.min(Math.hypot(S.vel.x, S.vel.z) * dt * 0.5, 0.02);
  } else if (S.mode === 'hop') {
    const H = S.hop;
    H.t += dt / H.dur;
    if (H.t >= 1) {
      S.pos.set(H.to.x, groundHeightAt(H.to.x, H.to.z), H.to.z);
      landFx(3.4);
      H.i++;
      if (H.done || H.i >= H.count) { S.mode = 'free'; S.vel.set(0, 0, 0); }
      else computeHopLeg();
    } else {
      S.pos.x = lerp(H.from.x, H.to.x, H.t);
      S.pos.z = lerp(H.from.z, H.to.z, H.t);
      S.pos.y = GROUND_Y + 4 * H.h * H.t * (1 - H.t);
    }
  } else if (S.mode === 'swing') {
    // v1.2: 坐在秋千上，位置跟随座椅、身体随摆动倾斜
    swing.seat.getWorldPosition(_seatPos);
    S.pos.set(_seatPos.x, _seatPos.y + 0.09, _seatPos.z);
    S.vel.set(0, 0, 0);
    mood.happy = Math.min(100, mood.happy + dt * 2.5);   // 荡秋千很开心
    slimeGroup.rotation.x = -swing.angle * 0.35;
    if (Math.abs(swing.angle) > 0.55 && swing.jigCd <= 0) {
      swing.jigCd = 0.65;
      S.sq.v -= 1.1;
    }
  } else if (S.mode === 'free' && S.danceT > 0) {
    // 跳舞：节奏摆动 + 小跳 + 音符
    S.danceT -= dt;
    const tt = 2.8 - S.danceT;
    S.pos.y = GROUND_Y + Math.abs(Math.sin(tt * 9)) * 0.15;
    S.yaw = S.danceBaseYaw + Math.sin(tt * 9) * 0.6;
    S.danceScale = 1 + 0.06 * Math.sin(tt * 18);
    S.vel.set(0, 0, 0);
    S.noteT -= dt;
    if (S.noteT <= 0) {
      S.noteT = 0.32;
      spawnNote();
      blip(DANCE_NOTES[S.beat % 4], DANCE_NOTES[S.beat % 4] * 1.5, 0.12, 0.07);
      S.beat++;
    }
    if (S.danceT <= 0) { S.pos.y = GROUND_Y; S.danceScale = 1; landFx(2.2); }
  } else { // free：重力 + 弹跳
    // 吃辣椒后：辣到满地乱窜
    if (S.zoomT > 0) {
      S.zoomT -= dt;
      S.zoomDirT -= dt;
      if (S.zoomDirT <= 0 && S.zoomT > 0) {
        S.zoomDirT = 0.24;
        const za = Math.random() * Math.PI * 2;
        S.vel.set(Math.cos(za) * 6.5, 3.2 + Math.random() * 1.2, Math.sin(za) * 6.5);
        spawnDebris(new THREE.Vector3(S.pos.x, S.pos.y + 1.1, S.pos.z), 1, [0xdddddd, 0xbfbfbf], -0.5, 0.4, 0.8);
        blip(480 + Math.random() * 320, 950, 0.07, 0.05);
      }
      if (S.zoomT <= 0) {
        S.wob1.v += 6;
        S.moodT = 1;
        toast('呼……好辣！！🔥');
      }
    }
    S.vel.y -= 26 * dt;
    S.pos.addScaledVector(S.vel, dt);
    const floorY = groundHeightAt(S.pos.x, S.pos.z);
    if (S.pos.y <= floorY) {
      S.pos.y = floorY;
      const iv = -S.vel.y;
      if (floorY > GROUND_Y && iv > 2.2) {
        // v1.2: 蹦床——越弹越高！
        tramp.bounces++;
        tramp.sag.v += 5;
        S.vel.y = Math.min(12.5, 7 + tramp.bounces * 1.1);
        S.sq.v -= 2.2;
        mood.happy = Math.min(100, mood.happy + 1.5);
        blip(150 + tramp.bounces * 40, 340 + tramp.bounces * 60, 0.16, 0.12);
        if (tramp.bounces === 1) { say('弹起来咯！'); toast('🤸 蹦床时间！会越弹越高，点地面跳走'); }
        else if (tramp.bounces === 4) say('飞高高！');
        else if (tramp.bounces % 6 === 0) say('停不下来啦～');
      } else if (floorY > GROUND_Y) {
        // 蹦床上轻轻落下 → 起弹
        S.vel.y = 7;
        tramp.sag.v += 3;
        blip(170, 320, 0.12, 0.08);
      } else if (iv > 1.4) {
        S.vel.y = iv * 0.36;                    // 弹起
        landFx(iv);
      } else {
        S.vel.y = 0;
        S.vel.x *= Math.exp(-6 * dt);
        S.vel.z *= Math.exp(-6 * dt);
        if (iv > 0.4) landFx(iv * 0.6);
      }
    }
    for (const ax of ['x', 'z']) {              // 边界反弹
      if (Math.abs(S.pos[ax]) > BOUND) {
        S.pos[ax] = Math.sign(S.pos[ax]) * BOUND;
        S.vel[ax] *= -0.45;
        S.wob1.v += 2;
      }
    }
  }

  // 实际速度（hop 模式下也能得到），用于朝向与果冻倾斜
  S.effVel.subVectors(S.pos, S.prev).divideScalar(Math.max(dt, 1e-4));

  // 各弹簧积分
  springUpdate(S.sq, 170, 11, dt);   S.sq.x = clamp(S.sq.x, -0.35, 0.55);
  springUpdate(S.wob1, 85, 3.5, dt); S.wob1.x = clamp(S.wob1.x, -0.085, 0.085);
  springUpdate(S.wob2, 105, 3.2, dt); S.wob2.x = clamp(S.wob2.x, -0.07, 0.07);

  // 非跳舞时才做果冻滞后倾斜 + 朝向
  if (!(S.mode === 'free' && S.danceT > 0)) {
    const tlx = clamp(-S.effVel.x * 0.045, -0.24, 0.24);
    const tlz = clamp(-S.effVel.z * 0.045, -0.24, 0.24);
    S.lean.x += (tlx - S.lean.x) * (1 - Math.exp(-9 * dt));
    S.lean.z += (tlz - S.lean.z) * (1 - Math.exp(-9 * dt));
    const spd = Math.hypot(S.effVel.x, S.effVel.z);
    const targetYaw = spd > 0.8 ? Math.atan2(S.effVel.x, S.effVel.z) : 0;
    S.yaw = lerpAngle(S.yaw, targetYaw, 1 - Math.exp(-8 * dt));
  }

  // 应用位置 / 旋转 / 挤压呼吸缩放（+ 变大 + 跳舞弹跳）
  const breath = Math.sin(t * 2.2);
  slimeGroup.position.copy(S.pos);
  slimeGroup.rotation.y = S.yaw;
  const extra = S.grow * S.danceScale;
  slimeGroup.scale.set(
    Math.max(0.4, (1 + 0.62 * S.sq.x) * (1 - 0.008 * breath) * extra),
    Math.max(0.35, (1 - 0.85 * S.sq.x) * (1 + 0.02 * breath) * extra),
    Math.max(0.4, (1 + 0.62 * S.sq.x) * (1 - 0.008 * breath) * extra)
  );

  // 顶点抖动：沿原始法线叠加两个衰减正弦模态 + 顶部滞后偏移
  const curGeo = slimeMesh.geometry;
  const posArr = curGeo.attributes.position.array;
  for (let i = 0; i < posArr.length; i += 3) {
    const bx = basePos[i], by = basePos[i + 1], bz = basePos[i + 2];
    const nx = baseNor[i], ny = baseNor[i + 1], nz = baseNor[i + 2];
    const h = clamp((by + 0.6725) / 1.5725, 0, 1);
    const d = S.wob1.x * Math.sin(t * 13 + by * 2.6 + bx * 1.9 + bz * 1.3)
            + S.wob2.x * Math.sin(t * 17.3 + bx * 2.2 - bz * 1.7);
    const hh = h * h;
    posArr[i]     = bx + nx * d + S.lean.x * hh;
    posArr[i + 1] = by + ny * d;
    posArr[i + 2] = bz + nz * d + S.lean.z * hh;
  }
  curGeo.attributes.position.needsUpdate = true;
  curGeo.computeVertexNormals();

  slimeGroup.updateMatrixWorld(true);
}

function updateFace(dt, t) {
  const S = slime;
  const dn = dnState.v;

  // 嘴巴：咀嚼 > 惊讶 > 心情表情
  if (S.chompT > 0) {
    S.chompT -= dt;
    smile.visible = false;
    mouthO.visible = true;
    mouthO.scale.setScalar(1.5 + 0.45 * Math.sin(t * 38));
    if (S.chompT <= 0) mouthO.scale.setScalar(1);
  } else if (S.moodT > 0) {
    S.moodT -= dt;
    smile.visible = false;
    mouthO.visible = true;
  } else {
    const sad = mood.happy < 28;
    smile.visible = true;
    mouthO.visible = false;
    smile.rotation.z = sad ? 0 : Math.PI;  // ∩ 苦瓜脸 / ∪ 微笑
  }

  // 眼睛：抚摸/开心时眯眯眼；夜晚犯困半闭；平时圆眼+眨眼
  const happyArc = (pet.active || mood.happy > 75) && S.moodT <= 0 && S.chompT <= 0;
  eyeL.group.visible = !happyArc;
  eyeR.group.visible = !happyArc;
  arcL.visible = happyArc;
  arcR.visible = happyArc;

  if (t > S.nextBlink) { S.blinkT = 0; S.nextBlink = t + (2.2 + Math.random() * 3.5) * (1 + dn); }
  let eyeScaleY = 1 - dn * 0.5;
  if (S.blinkT >= 0) {
    S.blinkT += dt;
    const ph = S.blinkT / 0.24;
    if (ph >= 1) { S.blinkT = -1; }
    else eyeScaleY *= Math.max(0.06, 1 - 0.95 * Math.sin(ph * Math.PI));
  }
  eyeL.group.scale.y = Math.max(0.05, eyeScaleY);
  eyeR.group.scale.y = Math.max(0.05, eyeScaleY);

  // 瞳孔跟随鼠标（转到史莱姆本地坐标计算）
  raycaster.setFromCamera(ndc, camera);
  let ok = raycaster.ray.intersectPlane(eyePlane, _v);
  if (!ok) _v.copy(camera.position);
  slimeGroup.worldToLocal(_v);
  _v.sub(new THREE.Vector3(0, 0.7, 0)).normalize();
  const px = clamp(_v.x, -1, 1) * 0.05;
  const py = clamp(_v.y, -1, 1) * 0.045;
  for (const eye of [eyeL, eyeR]) {
    eye.pupil.position.set(
      eye.n.x * 0.082 + eye.right.x * px + eye.up.x * py,
      eye.n.y * 0.082 + eye.right.y * px + eye.up.y * py,
      eye.n.z * 0.082 + eye.right.z * px + eye.up.z * py
    );
  }
}

/* ================= 每帧更新：全局逻辑 ================= */
function updateGameLogic(dt, t) {
  const S = slime;

  // --- 抚摸判定：按住史莱姆不动超过 420ms ---
  if (drag.active && drag.kind === 'slime' && !drag.moved && slime.mode === 'free'
      && slime.pos.y <= GROUND_Y + 0.05 && performance.now() - drag.t0 > 420) {
    if (!pet.active) {
      pet.active = true;
      pet.pulse = 0;
      S.sq.v -= 1;
      say('摸摸头～');
      if (!pet.toastShown) { pet.toastShown = true; toast('被摸得好舒服～❤️ 继续按住'); }
    }
  }
  if (pet.active) {
    mood.happy = Math.min(100, mood.happy + dt * 7);
    achInc('pet10', dt);
    pet.pulse -= dt;
    if (pet.pulse <= 0) {
      pet.pulse = 0.26;
      spawnHeart(new THREE.Vector3(
        S.pos.x + (Math.random() - 0.5) * 0.7, S.pos.y + 1.3 + Math.random() * 0.3, S.pos.z + (Math.random() - 0.5) * 0.4));
      blip(90 + Math.random() * 35, 65, 0.13, 0.05);
      S.sq.v -= 0.35;
    }
  } else {
    mood.happy = Math.max(0, mood.happy - dt * 0.35);
  }
  // 下雨天天心情会慢慢变好（史莱姆喜欢雨天）
  if (weather.rainAmt > 0.7) mood.happy = Math.min(100, mood.happy + dt * 0.5);

  // --- 自动去吃苹果 ---
  if (S.mode === 'free' && S.pos.y <= GROUND_Y + 0.05 && S.danceT <= 0 && S.chompT <= 0 && !pet.active && S.zoomT <= 0) {
    for (const f of foods) {
      if (f.eaten || !f.resting) continue;
      const d = Math.hypot(f.pos.x - S.pos.x, f.pos.z - S.pos.z);
      if (d < 0.8) { eatFood(f); break; }
      if (d < 8 && S.hopCooldown <= 0) {
        S.hopCooldown = 1.2;
        startHops(f.pos);
        break;
      }
    }
  }

  // --- 摘星挑战：碰到星星就收集，并自动追下一颗 ---
  if (starGame.active && S.mode === 'free' && !pet.active && S.danceT <= 0 && S.chompT <= 0 && S.zoomT <= 0) {
    for (let i = starGame.stars.length - 1; i >= 0; i--) {
      const st = starGame.stars[i];
      const d = Math.hypot(st.mesh.position.x - S.pos.x, st.mesh.position.z - S.pos.z);
      if (d < 0.65 && S.pos.y < 1.1) {
        collectStar(st);
        starGame.stars.splice(i, 1);
      }
    }
    if (starGame.active && starGame.stars.length > 0 && S.pos.y <= GROUND_Y + 0.05 && S.hopCooldown <= 0) {
      let best = null, bd = 99;
      for (const st of starGame.stars) {
        const d = Math.hypot(st.mesh.position.x - S.pos.x, st.mesh.position.z - S.pos.z);
        if (d < bd) { bd = d; best = st; }
      }
      if (best && bd > 0.7 && bd < 9) {
        S.hopCooldown = 1.0;
        startHops(best.mesh.position);
      }
    }
  }

  // --- 没有吃的就去追球玩 ---
  if (ball && ball.mode === 'free' && S.mode === 'free' && S.pos.y <= GROUND_Y + 0.05 &&
      S.danceT <= 0 && S.chompT <= 0 && !pet.active && S.zoomT <= 0 && mood.happy > 35 && !starGame.active) {
    const hasFood = foods.some(f => !f.eaten && f.resting);
    const bd = Math.hypot(ball.pos.x - S.pos.x, ball.pos.z - S.pos.z);
    if (!hasFood && bd > 1.1 && bd < 6 && S.hopCooldown <= 0) {
      S.hopCooldown = 1.0;
      startHops(ball.pos);
    }
  }

  // --- 设施：走到秋千旁就坐；离开蹦床后重置弹跳 ---
  if (pendingFacility === 'swing' && S.mode === 'free' && S.pos.y <= GROUND_Y + 0.05) {
    const dSw = Math.hypot(S.pos.x - SWING.x, S.pos.z - SWING.z);
    if (dSw < 0.55) { pendingFacility = null; startSwing(); }
    else if (dSw > 1.8) pendingFacility = null;
  }
  if (Math.hypot(S.pos.x - TRAMP.x, S.pos.z - TRAMP.z) > TRAMP.r + 0.25) tramp.bounces = 0;

  // --- 闲逛（v1.2）：没人理的时候自己溜达，学 Jelly Baby“闲不下来”的生命感 ---
  if (drag.active || pet.active || S.mode !== 'free') S.wanderT = Math.max(S.wanderT, 6);
  S.wanderT -= dt;
  if (S.wanderT <= 0 && S.mode === 'free' && S.pos.y <= GROUND_Y + 0.05 &&
      S.danceT <= 0 && S.chompT <= 0 && S.zoomT <= 0 && !pet.active) {
    S.wanderT = 6 + Math.random() * 8;
    const busy = starGame.active || foods.some(f => !f.eaten && f.resting) || (ball && ball.mode === 'free');
    if (!busy && mood.happy > 45) {
      if (Math.random() < 0.35) {           // 原地小跳，四处张望
        S.vel.y = 2.6;
        S.sq.v -= 1.2;
        blip(300, 460, 0.08, 0.05);
      } else {                              // 挑个附近的地方跳过去
        const wa = Math.random() * Math.PI * 2;
        const wr = 0.7 + Math.random() * 1.4;
        startHops(new THREE.Vector3(S.pos.x + Math.cos(wa) * wr, GROUND_Y, S.pos.z + Math.sin(wa) * wr));
      }
    }
  }

  // --- 待机小动作：开心小跳 / 难过叹气 / 夜晚打瞌睡 ---
  S.idleHopT -= dt;
  if (S.idleHopT <= 0) {
    S.idleHopT = 5 + Math.random() * 5;
    if (S.mode === 'free' && S.pos.y <= GROUND_Y + 0.05 && S.danceT <= 0 && !pet.active && S.zoomT <= 0) {
      if (mood.happy > 75) { S.vel.y = 3.2; S.sq.v -= 1.5; blip(330, 520, 0.09, 0.07); }
      else if (mood.happy < 28) { S.sq.v -= 0.9; blip(140, 70, 0.3, 0.06); }
    }
  }
  S.zT -= dt;
  if (S.zT <= 0) {
    S.zT = 3.5 + Math.random() * 2;
    if (dnState.v > 0.6 && S.mode === 'free' && S.pos.y <= GROUND_Y + 0.05 && !pet.active && S.danceT <= 0) spawnZ();
  }

  // --- 消化：慢慢变回原大小 ---
  if (S.grow > 1) S.grow = Math.max(1, S.grow - dt * 0.006);

  // --- 彩虹模式 ---
  if (slimeRainbow) {
    const hue = (t * 0.05) % 1;
    slimeMat.color.setHSL(hue, 0.7, 0.62);
    slimeMat.attenuationColor.setHSL(hue, 0.85, 0.5);
  }
}

/* ================= UI：心情条 / 提示 / 按钮 ================= */
const moodFill = document.getElementById('moodFill');
const moodFace = document.getElementById('moodFace');
function updateMoodUI() {
  const h = mood.happy;
  moodFill.style.width = h + '%';
  moodFill.style.background = h > 60 ? '#5fd07a' : h > 30 ? '#ffb84d' : '#ff7d6e';
  moodFace.textContent = h > 60 ? '😀' : h > 30 ? '😐' : '😟';
}
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(txt) {
  toastEl.textContent = txt;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}
document.getElementById('feedBtn').addEventListener('click', spawnFood);
document.getElementById('chiliBtn').addEventListener('click', spawnChili);
document.getElementById('ballBtn').addEventListener('click', toggleBall);
document.getElementById('starBtn').addEventListener('click', toggleStarGame);
document.getElementById('shapeBtn').addEventListener('click', cycleShape);
document.getElementById('babyBtn').addEventListener('click', toggleBaby);
document.getElementById('hatBtn').addEventListener('click', cycleHat);
document.getElementById('danceBtn').addEventListener('click', startDance);
document.getElementById('paletteBtn').addEventListener('click', () => {
  ensureAudio();
  document.getElementById('palettePanel').classList.toggle('open');
});
// 天气切换：晴 → 雨 → 雪
const weatherBtn = document.getElementById('weatherBtn');
weatherBtn.addEventListener('click', () => {
  ensureAudio();
  weather.mode = (weather.mode + 1) % 3;
  weatherBtn.textContent = ['☔', '❄️', '☀️'][weather.mode];
  toast(['☔ 下雨啦！史莱姆最喜欢雨天～', '❄️ 下雪了，好安静呀…', '☀️ 天晴啦！'][weather.mode]);
  blip(500, 760, 0.12, 0.08);
});
// 拍照模式：隐藏界面 + 尝试保存快照
const photoBtn = document.getElementById('photoBtn');
function setPhotoMode(on) {
  document.body.classList.toggle('photo', on);
  photoBtn.textContent = on ? '🖼️' : '📷';
  if (on) {
    toast('📷 拍照模式（按 Esc 或再点相机退出）');
    try {
      renderer.render(scene, camera);
      canvas.toBlob((blob) => {
        try {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'slime-' + Date.now() + '.png';
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 3000);
        } catch (e) { /* 下载被拦截时只隐藏界面 */ }
      });
    } catch (e) { /* ignore */ }
  } else {
    toast('欢迎回来！');
  }
}
photoBtn.addEventListener('click', () => {
  ensureAudio();
  setPhotoMode(!document.body.classList.contains('photo'));
});
// 种花模式开关
document.getElementById('plantBtn').addEventListener('click', () => {
  ensureAudio();
  plantMode = !plantMode;
  document.getElementById('plantBtn').classList.toggle('active', plantMode);
  toast(plantMode ? '🌱 种花模式：点击地面种花！' : '退出了种花模式');
  blip(600, plantMode ? 980 : 420, 0.1, 0.09);
});
// 捕获运行期错误，方便调试
window.addEventListener('error', (e) => toast('⚠️ ' + e.message));
// 调试探针（不影响玩法）：控制台输入 window.__debug() 查看史莱姆状态与屏幕坐标
window.__debug = () => {
  const p = _v.copy(slime.pos);
  p.y += 0.7;
  p.project(camera);
  return {
    world: slime.pos.toArray().map(n => +n.toFixed(2)),
    vel: slime.vel.toArray().map(n => +n.toFixed(2)),
    target: slime.grabTarget.toArray().map(n => +n.toFixed(2)),
    screen: [Math.round((p.x + 1) / 2 * innerWidth), Math.round((1 - p.y) / 2 * innerHeight)],
    mode: slime.mode,
    frames: tickFrames,
    mood: Math.round(mood.happy),
  };
};
// 手动步进（调试用）：无头环境 / 自动化测试里可以用 __tick() 驱动模拟
window.__tick = (n = 1) => { for (let i = 0; i < n; i++) tickBody(); };

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let tickFrames = 0;
function tickBody() {
  tickFrames++;
  const dt = Math.min(clock.getDelta(), 0.033);
  const t = clock.elapsedTime;

  updateSlime(dt, t);
  updateFace(dt, t);
  updateGameLogic(dt, t);
  updateFoods(dt);
  updateBall(dt);
  updatePlants(dt);
  updateStarGame(dt, t);
  updateFishes(dt);
  updateSwing(dt, t);
  updateBabies(dt, t);
  updateButterflies(dt, t);
  updateFireflies(t);
  updateWeatherFx(dt, t);
  updateSpeech(dt);
  updateRipples(dt);
  updateFloatPool(debrisPool, dt);
  updateFloatPool(heartPool, dt);
  updateFloatPool(notePool, dt);
  updateFloatPool(zzzPool, dt);
  applyDayNight(dt);
  updateAtmosphere(dt, t);
  updateWorldDetail(dt, t);
  updateMoodUI();

  for (const c of clouds) {
    c.position.x += c.userData.v * dt;
    if (c.position.x > 15) c.position.x = -15;
  }

  // 悬停光标提示
  if (!drag.active) {
    canvas.style.cursor = pickTarget().kind !== 'none' ? 'grab' : 'default';
  }

  controls.update();
  renderer.render(scene, camera);
}
function tick() {
  requestAnimationFrame(tick);
  tickBody();
}
tick();
// 页面在后台（rAF 暂停）时，用定时器继续驱动模拟
setInterval(() => { if (document.hidden) tickBody(); }, 66);

// 首帧渲染完成后再淡入，并隐藏加载页
canvas.classList.add('ready');
document.getElementById('loading').classList.add('hide');

// 开场引导
slime.wob1.v = 6;
spawnRipple(0, 0, 0.5);
setTimeout(() => toast('点我、拖我、长按摸摸我 →'), 1200);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
