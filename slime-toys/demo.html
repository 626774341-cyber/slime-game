<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧸 四个小玩具 · 组件演示</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:sans-serif;background:#a5dcff;}
  #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.85);
    padding:8px 18px;border-radius:999px;font-size:13px;color:#3d4a3f;text-align:center;}
</style>
</head>
<body>
<div id="hint">🤸 蹦床 · 🦆 鸭子 · 🐸 青蛙荷叶 · 🐰 兔子（点它喂食）<br>演示球自己蹦——落在蹦床和荷叶上会被弹飞，兔子会追着球跑</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ⬇️⬇️ 四个组件，各一行引入
import { createTrampoline } from './toy-trampoline.js';
import { createDucks }      from './toy-ducks.js';
import { createFrog }       from './toy-frog.js';
import { createRabbit }     from './toy-rabbit.js';

/* ---- 基础场景 ---- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa5dcff);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xbfe8ff, 0x7fae6a, 0.9));
const sun = new THREE.DirectionalLight(0xfff2d8, 2);
sun.position.set(10, 14, 8);
sun.castShadow = true;
scene.add(sun);

/* ---- 平地 + 水塘 ---- */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 48),
  new THREE.MeshStandardMaterial({ color:0x8fce62, roughness:1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const pond = new THREE.Mesh(
  new THREE.CircleGeometry(2.5, 36),
  new THREE.MeshStandardMaterial({ color:0x2f9dd8, transparent:true, opacity:0.9 })
);
pond.rotation.x = -Math.PI/2;
pond.position.set(0, 0.02, 5);
scene.add(pond);

/* ---- ⭐⭐⭐ 接入四个组件（每个 1 行） ---- */
const tramp  = createTrampoline(THREE, scene, camera, { x: 0, z: 2 });
const ducks  = createDucks(THREE, scene, camera, { x: 0, z: 5, r: 2.5 });
const frog   = createFrog(THREE, scene, camera, { pads: [[-1.4, 4.2], [0.6, 4.6]] });
const rabbit = createRabbit(THREE, scene, camera, { x: -2, z: -1 });

/* ---- 演示球：自动蹦跳（展示蹦床/荷叶的物理挂钩） ---- */
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 18, 14),
  new THREE.MeshStandardMaterial({ color:0xff6b8f, roughness:0.4 })
);
ball.castShadow = true;
scene.add(ball);
const rand = (a,b)=>a+Math.random()*(b-a);
const bvel = new THREE.Vector3(rand(-1,1), 5, rand(-1,1));
let hopT = 0;

let camA = 0;
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
(function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* 演示球物理：落地时问蹦床/荷叶要不要弹 */
  bvel.y -= 18*dt;
  ball.position.addScaledVector(bvel, dt);
  const floorY = 0;   // 平地（起伏地形就换成你的 groundY）
  if(ball.position.y < floorY + 0.3){
    ball.position.y = floorY + 0.3;
    const v1 = tramp.getBounce(ball.position.x, ball.position.z, -bvel.y);
    const v2 = frog.getBounce(ball.position.x, ball.position.z, -bvel.y);
    const vy = v1 !== null ? v1 : v2;
    if(vy !== undefined && vy !== null){ bvel.y = vy; }
    else if(bvel.y < -1){ bvel.y *= -0.5; }
    else {
      bvel.y = 0;
      hopT -= dt;
      if(hopT <= 0){
        hopT = rand(0.4, 1.2);
        const a = rand(0, 6.28);
        bvel.x = Math.cos(a)*rand(0.5, 2); bvel.z = Math.sin(a)*rand(0.5, 2);
        bvel.y = rand(4, 7);
      }
    }
  }
  const bd = Math.hypot(ball.position.x, ball.position.z);
  if(bd > 8){ ball.position.x *= 8/bd; ball.position.z *= 8/bd; }

  /* 兔子把球当"玩家"：没喂时躲球，喂了跟球 */
  rabbit.setPlayer(ball.position.x, ball.position.z);

  /* ⭐ 每帧更新四个组件 */
  tramp.update(dt);
  ducks.update(dt, t);
  frog.update(dt, t);
  rabbit.update(dt);

  camA += dt*0.12;
  camera.position.set(Math.sin(camA)*11, 6, Math.cos(camA)*11);
  camera.lookAt(0, 0.5, 2);

  renderer.render(scene, camera);
})();
</script>
</body>
</html>
