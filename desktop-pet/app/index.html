<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>箱庭世界 · 3D 史莱姆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: #bfe4f7;
  }
  #c { display: block; width: 100%; height: 100%; touch-action: none; cursor: default; opacity: 0; transition: opacity 1.2s ease; }
  #c.ready { opacity: 1; }
  .card {
    position: fixed; background: rgba(255,255,255,.72); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border-radius: 16px;
    box-shadow: 0 8px 24px rgba(60,90,140,.15); color: #2c4a66; z-index: 5;
  }
  #title { top: 18px; left: 18px; padding: 12px 18px; animation: drop .8s ease both; }
  #title h1 { font-size: 20px; letter-spacing: 1px; }
  #title p { font-size: 12px; opacity: .75; margin-top: 3px; }
  #hints { bottom: 16px; left: 50%; transform: translateX(-50%); padding: 10px 12px;
           display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 62vw;
           animation: rise .8s .3s ease both; }
  #hints span { font-size: 12px; white-space: nowrap; background: rgba(255,255,255,.7);
                border-radius: 999px; padding: 5px 10px; }
  .iconbtn { width: 44px; height: 44px; display: flex; align-items: center;
          justify-content: center; font-size: 20px; cursor: pointer; user-select: none; }
  #mute { top: 18px; right: 18px; animation: drop .8s .1s ease both; }
  #nightBtn { top: 18px; right: 72px; animation: drop .8s .15s ease both; }
  #weatherBtn { top: 18px; right: 126px; animation: drop .8s .2s ease both; }
  #photoBtn { top: 18px; right: 180px; animation: drop .8s .25s ease both; }
  .iconbtn:hover { background: rgba(255,255,255,.92); }
  .card { transition: opacity .4s ease; }
  /* 拍照模式：隐藏所有界面（相机按钮除外） */
  body.photo .card:not(#photoBtn), body.photo #toast { opacity: 0; pointer-events: none; animation: none; }
  /* 右侧工具栏 */
  #toolbar { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column;
             gap: 10px; z-index: 6; animation: riseUp .8s .4s ease both; }
  .tool { position: static; width: 46px; height: 46px; font-size: 22px; border: none; cursor: pointer;
          display: flex; align-items: center; justify-content: center; transition: background .2s ease; }
  .tool.active { background: rgba(126,200,250,.95); box-shadow: 0 0 0 3px rgba(126,200,250,.35); }
  .tool:hover { background: rgba(255,255,255,.92); }
  .tool:active { transform: scale(.9); }
  /* 调色面板 */
  #palettePanel { position: fixed; right: 72px; bottom: 120px; padding: 10px; display: none;
                  gap: 8px; z-index: 7; }
  #palettePanel.open { display: flex; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff;
            cursor: pointer; box-shadow: 0 2px 6px rgba(60,90,140,.25); }
  .swatch:hover { transform: scale(1.15); }
  .swatch.rainbow { background: conic-gradient(#ff6b6b,#ffb56b,#ffe45e,#6bde7c,#5ec8ff,#b78aff,#ff6bd8,#ff6b6b); }
  /* 变身面板：经典形状 + Emoji 果冻，一个面板全搞定 */
  #shapePanel { position: fixed; right: 72px; bottom: 120px; padding: 12px; display: none;
                flex-wrap: wrap; gap: 8px; z-index: 7; max-width: 312px; }
  #shapePanel.open { display: flex; }
  #shapePanel .sp-head { width: 100%; font-size: 11px; color: #5b7c99; padding: 2px 2px 0; }
  .shapeTile { width: 60px; border: none; border-radius: 12px; cursor: pointer;
               background: rgba(126,200,250,.16); padding: 8px 0 6px; text-align: center;
               transition: background .15s; }
  .shapeTile:hover { background: rgba(126,200,250,.5); }
  .shapeTile:active { transform: scale(.92); }
  .shapeTile .ic { font-size: 26px; display: block; }
  .shapeTile .lb { font-size: 10px; color: #2c4a66; margin-top: 3px; display: block; }
  /* 心情条 */
  #moodCard { bottom: 16px; left: 18px; padding: 10px 14px; display: flex; align-items: center;
              gap: 8px; animation: riseUp .8s .45s ease both; }
  #moodFace { font-size: 18px; }
  #moodBar { width: 110px; height: 10px; border-radius: 999px; background: rgba(120,150,180,.25);
             overflow: hidden; }
  #moodFill { height: 100%; width: 62%; border-radius: 999px; background: #5fd07a; transition: width .3s ease; }
  #moodLabel { font-size: 12px; opacity: .8; }
  /* 摘星挑战计分板 */
  #starHud { top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 20px;
             font-size: 15px; font-weight: 600; display: none; }
  #starHud.show { display: block; }
  /* 提示气泡 */
  #toast { position: fixed; bottom: 86px; left: 50%; transform: translate(-50%, 8px);
           background: rgba(35,58,82,.82); color: #fff; font-size: 13px; padding: 8px 18px;
           border-radius: 999px; opacity: 0; transition: all .35s ease; pointer-events: none;
           z-index: 8; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             flex-direction: column; gap: 16px; background: #bfe4f7; z-index: 10;
             transition: opacity .6s ease; color: #2c4a66; }
  #loading .ball { width: 46px; height: 40px; border-radius: 50% 50% 45% 45%;
             background: radial-gradient(circle at 32% 28%, #b8ecff, #3ec1ff 70%);
             box-shadow: 0 6px 16px rgba(46,150,220,.35); animation: squish 1s ease-in-out infinite; }
  #loading p { font-size: 14px; letter-spacing: 3px; }
  #loading.hide { opacity: 0; pointer-events: none; }
  @keyframes squish { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.15,.82); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translate(-50%,14px); } to { opacity: 1; transform: translate(-50%,0); } }
  @keyframes riseUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>

  <button class="shapeTile" data-emoji="🐰"><span class="ic">🐰</span></button>
  <button class="shapeTile" data-emoji="🍄"><span class="ic">🍄</span></button>

  <button class="card tool" id="feedBtn" title="投喂苹果">🍎</button>
  <button class="card tool" id="chiliBtn" title="投喂辣椒（后果自负）">🌶️</button>

<script type="module">
import * as THREE from 'three';

/* ================= 小工具 ================= */
const { clamp, lerp } = THREE.MathUtils;
function lerpAngle(a, b, t) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  else if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
// 固定种子的伪随机数，保证每次打开场景布置一致
function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260917);
const GROUND_Y = 0.02;   // 草地表面高度

function inPond(x, z) {
  const dx = x - POND.x, dz = z - POND.z;
  return dx * dx + dz * dz < POND.r * POND.r;
}

/* ================= 渲染器 / 场景 / 相机 ================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);

scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.06).texture;

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.2, 0);

/* ================= 灯光 ================= */
const sun = new THREE.DirectionalLight(0xfff1dc, 2.3);
sun.position.set(6, 10, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
sun.shadow.camera.top = 9;   sun.shadow.camera.bottom = -9;
sun.shadow.camera.near = 2;  sun.shadow.camera.far = 30;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0xa08a6a, 0.6);
scene.add(hemi);
// 月光（夜晚淡入）
const moonLight = new THREE.DirectionalLight(0x9db8ff, 0);
moonLight.position.set(-10, 12, -8);
scene.add(moonLight);

/* ================= 箱庭世界（微缩景观） ================= */
const world = new THREE.Group();
scene.add(world);

const matWood  = new THREE.MeshStandardMaterial({ color: 0x9a6a45, roughness: 0.85 });
const matGrass = new THREE.MeshStandardMaterial({ color: 0x82c95e, roughness: 0.95 });

const matCloud = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });

// 木质底座 + 草地台面
const baseBox = new THREE.Mesh(new THREE.BoxGeometry(10.5, 1.1, 10.5), matWood);
baseBox.position.y = -0.57;
baseBox.receiveShadow = true;
world.add(baseBox);

const grassTop = new THREE.Mesh(new THREE.BoxGeometry(10, 0.24, 10), matGrass);
grassTop.position.y = -0.11;
grassTop.receiveShadow = true;
world.add(grassTop);

// 小池塘（沙滩边 + 水面）
const pondSand = new THREE.Mesh(new THREE.CircleGeometry(1.5, 40), matSand);
pondSand.rotation.x = -Math.PI / 2;
pondSand.position.set(POND.x, 0.015, POND.z);
pondSand.receiveShadow = true;
world.add(pondSand);
const pond = new THREE.Mesh(new THREE.CircleGeometry(1.25, 40), matPond);
pond.rotation.x = -Math.PI / 2;
pond.position.set(POND.x, 0.022, POND.z);
world.add(pond);

// 一棵低多边形小树
function makeTree(s = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09 * s, 0.13 * s, 0.55 * s, 7), matTrunk);
  trunk.position.y = 0.275 * s; trunk.castShadow = true; g.add(trunk);
  const c1 = new THREE.Mesh(new THREE.ConeGeometry(0.62 * s, 0.85 * s, 8), matLeafA);
  c1.position.y = 0.92 * s; c1.castShadow = true; g.add(c1);
  const c2 = new THREE.Mesh(new THREE.ConeGeometry(0.45 * s, 0.7 * s, 8), matLeafB);
  c2.position.y = 1.38 * s; c2.castShadow = true; g.add(c2);
  const c3 = new THREE.Mesh(new THREE.ConeGeometry(0.28 * s, 0.5 * s, 8), matLeafC);
  c3.position.y = 1.75 * s; c3.castShadow = true; g.add(c3);
  return g;
}
[[-0.9, -4.0, 1.15], [3.9, -3.1, 0.95], [-4.1, 1.8, 1.0], [4.0, 3.2, 1.25], [-2.2, 4.1, 0.85]]
  .forEach(([x, z, s]) => {
    const t = makeTree(s);
    t.position.set(x, 0.01, z);
    t.rotation.y = rand() * Math.PI * 2;
    world.add(t);
  });

// 石头
function makeRock(r) {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), matRock);
  m.scale.y = 0.7;
  m.rotation.set(rand() * 3, rand() * 3, rand() * 3);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
[[-1.8, 3.6, 0.4], [1.4, 4.0, 0.28], [-4.2, -1.2, 0.35], [3.3, 1.3, 0.24],
 [1.2, -1.1, 0.18], [3.4, -2.7, 0.22], [1.9, -3.0, 0.15]]
  .forEach(([x, z, r]) => { const m = makeRock(r); m.position.set(x, 0.03, z); world.add(m); });

// 小花
const flowerColors = [0xff8fb3, 0xffd45e, 0xffffff, 0xc39bff];
function makeFlower(color) {
  const g = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.024, 0.28, 6),
    new THREE.MeshStandardMaterial({ color: 0x4f9e46, roughness: 1 }));
  stem.position.y = 0.14; g.add(stem);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 10),
    new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));
  head.position.y = 0.3; head.castShadow = true; g.add(head);
  return g;
}
const FLOWER_SPOTS = [[-2.5, 0.8], [1.8, 1.6], [-0.8, 2.8], [3.5, 0.2], [-3.0, 3.2], [0.8, -3.7], [-4.3, -2.6], [2.8, 3.9]];
FLOWER_SPOTS.forEach(([x, z], i) => {
  const f = makeFlower(flowerColors[i % flowerColors.length]);
  f.position.set(x, 0.01, z);
  world.add(f);
});

// 草丛
const matTuft = new THREE.MeshStandardMaterial({ color: 0x5aa84c, roughness: 1 });
for (let i = 0; i < 24; i++) {
  let x, z, ok = false;
  while (!ok) {
    x = (rand() * 2 - 1) * 4.6; z = (rand() * 2 - 1) * 4.6;
    ok = Math.hypot(x, z) > 1.3 && Math.hypot(x - POND.x, z - POND.z) > 1.75;
  }
  const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.2, 5), matTuft);
  tuft.position.set(x, 0.1, z);
  tuft.rotation.set((rand() - 0.5) * 0.5, rand() * Math.PI * 2, (rand() - 0.5) * 0.5);
  world.add(tuft);
}

// 石板小路
const matStone = new THREE.MeshStandardMaterial({ color: 0xcfcabc, roughness: 0.9 });
[[-1.1, -1.1], [-1.75, -1.75], [-2.4, -2.4]].forEach(([x, z]) => {
  const s = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.06, 7), matStone);
  s.position.set(x, 0.04, z);
  s.rotation.y = rand() * Math.PI;
  s.receiveShadow = true;
  world.add(s);
});

// 蹦床蘑菇：踩上去会被弹飞
const MUSH = { x: -1.6, z: 1.7 };
{

  cap.scale.set(1, 0.55, 1);
  cap.position.y = 0.44;
  cap.castShadow = true;
  g.add(stem, cap);
  const dotMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
  [[-0.24, 0.6, 0.12, 0.07], [0.2, 0.58, -0.14, 0.06], [0.02, 0.64, 0.3, 0.055], [-0.12, 0.56, -0.32, 0.05]]
    .forEach(([x, y, z, r]) => {
      const dot = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), dotMat);
      dot.position.set(x, y, z);
      g.add(dot);
    });
  g.position.set(MUSH.x, 0.01, MUSH.z);
  world.add(g);
}

/* ================= 障碍物禁区（防穿模 / 防卡模型） ================= */
// 圆形禁区：树冠、小屋。史莱姆 / 宝宝 / 球 / 掉落物都会被推出禁区，
// 跳跃目标落在禁区内也会自动重定向到最近的合法点
const OBSTACLES = [
  { x: -0.9, z: -4.0, r: 0.60 },   // 树 1
  { x: 3.9,  z: -3.1, r: 0.52 },   // 树 2
  { x: -4.1, z: 1.8,  r: 0.52 },   // 树 3
  { x: 4.0,  z: 3.2,  r: 0.62 },   // 树 4
  { x: -2.2, z: 4.1,  r: 0.46 },   // 树 5
  { x: HOUSE_POS.x, z: HOUSE_POS.z, r: 1.12 }, // 小屋
];
// 把点推出所有禁区（p: {x,z} 形式的向量对象），返回是否发生推挤
function pushOutOfObstacles(p, radius) {
  let pushed = false;
  for (const o of OBSTACLES) {
    const dx = p.x - o.x, dz = p.z - o.z;
    const d = Math.hypot(dx, dz) || 1e-4;
    const min = o.r + radius;
    if (d < min) {
      p.x = o.x + dx / d * min;
      p.z = o.z + dz / d * min;
      pushed = true;
    }
  }
  return pushed;
}
// 求某点最近的禁区外合法点（最多迭代 3 次处理禁区相邻的情况）
function nearestOutsidePoint(x, z, radius) {
  let px = x, pz = z;
  for (let k = 0; k < 3; k++) {
    let moved = false;
    for (const o of OBSTACLES) {
      const dx = px - o.x, dz = pz - o.z;
      const d = Math.hypot(dx, dz) || 1e-4;
      const min = o.r + radius;
      if (d < min) { px = o.x + dx / d * min; pz = o.z + dz / d * min; moved = true; }
    }
    if (!moved) break;
  }
  return { x: clamp(px, -BOUND + 0.3, BOUND - 0.3), z: clamp(pz, -BOUND + 0.3, BOUND - 0.3) };
}
// 线段 (x,z)→(tx,tz) 前进方向上第一个挡路的障碍物：
// 返回 { t: 撞点距离, o: 障碍物 }，畅通返回 null
function firstBlockingObstacle(x, z, tx, tz, radius) {
  const dx = tx - x, dz = tz - z;
  const L = Math.hypot(dx, dz) || 1e-6;
  const ux = dx / L, uz = dz / L;
  let best = null;
  for (const o of OBSTACLES) {
    const min = o.r + radius;
    const fx = x - o.x, fz = z - o.z;
    const c = fx * fx + fz * fz - min * min;
    if (c < 0) return { t: 0, o };            // 起点在禁区内
    const b = fx * ux + fz * uz;
    if (b >= 0) continue;                     // 障碍物在身后，撞不上
    const D = b * b - c;
    if (D < 0) continue;                      // 射线擦不到
    const t = -b - Math.sqrt(D);
    if (t >= 0 && t <= L && (!best || t < best.t)) best = { t, o };
  }
  return best;
}
function segmentToObstacle(x, z, tx, tz, radius) {
  const blk = firstBlockingObstacle(x, z, tx, tz, radius);
  return blk ? blk.t : -1;
}
// 找一个"切线绕行点"：从挡路的障碍物旁边绕过去，而不是傻停在树边。
// 优先绕目标所在的那一侧；绕行点必须一路畅通、且比当前位置更接近目标（防止绕反 / 打转）
function pickWaypoint(p, target) {
  const blk = firstBlockingObstacle(p.x, p.z, target.x, target.z, 0.55);
  if (!blk) return null;
  const o = blk.o;
  const R = o.r + 0.66;                        // 绕行圈半径 = 禁区 + 史莱姆体积 + 余量
  const px = p.x - o.x, pz = p.z - o.z;
  const d = Math.hypot(px, pz) || 1e-4;
  // 目标在 (圆心→p) 连线的哪一侧，就沿哪一侧绕（cross > 0 = 左侧）
  const side = Math.sign(px * (target.z - p.z) - pz * (target.x - p.x)) || 1;
  const alpha = Math.atan2(pz, px);
  const beta = Math.acos(Math.min(1, R / d));  // 从 p 看绕行圈的两条切线夹角
  let w;
  if (beta < 0.5) {
    // 已经几乎贴着绕行圈：沿切线方向走一小段弦绕过去
    w = { x: p.x + (-pz / d * side) * 0.9, z: p.z + (px / d * side) * 0.9 };
  } else {
    const a = side > 0 ? alpha + beta : alpha - beta;
    w = { x: o.x + Math.cos(a) * R, z: o.z + Math.sin(a) * R };
  }
  if (segmentToObstacle(p.x, p.z, w.x, w.z, 0.55) < 0 &&
      Math.hypot(w.x - target.x, w.z - target.z) < Math.hypot(p.x - target.x, p.z - target.z)) return w;
  return null;
}

function updateWeatherFx(dt, t) {
  weather.rainAmt += ((weather.mode === 1 ? 1 : 0) - weather.rainAmt) * Math.min(1, dt * 1.2);
  weather.snowAmt += ((weather.mode === 2 ? 1 : 0) - weather.snowAmt) * Math.min(1, dt * 1.2);
  const dn = dnState.v;
  if (weather.rainAmt > 0.01) {
    for (let i = 0; i < RAIN_N; i++) {
      const d = rainDrops[i];
      d.y -= 13 * dt;
      if (d.y < 0) { d.y = 6 + Math.random() * 2.5; d.x = (Math.random() * 2 - 1) * 5; d.z = (Math.random() * 2 - 1) * 5; }
      const o = i * 6;
      rainPos[o] = d.x; rainPos[o + 1] = d.y; rainPos[o + 2] = d.z;
      rainPos[o + 3] = d.x; rainPos[o + 4] = d.y - 0.26; rainPos[o + 5] = d.z;
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  rainMat.opacity = weather.rainAmt * (0.3 + 0.15 * dn);
  if (weather.snowAmt > 0.01) {
    for (let i = 0; i < SNOW_N; i++) {
      const f = snowFlakes[i];
      f.y -= 0.9 * dt;
      f.x += Math.sin(t * 0.8 + f.ph) * 0.18 * dt;
      if (f.y < 0) { f.y = 6 + Math.random() * 2.5; f.x = (Math.random() * 2 - 1) * 5; f.z = (Math.random() * 2 - 1) * 5; }
      const o = i * 3;
      snowPos[o] = f.x; snowPos[o + 1] = f.y; snowPos[o + 2] = f.z;
    }
    snowGeo.attributes.position.needsUpdate = true;
  }
  snowMat.opacity = weather.snowAmt * 0.9;
  // 雨点落地涟漪
  weather.rippleT -= dt;
  if (weather.rainAmt > 0.6 && weather.rippleT <= 0) {
    weather.rippleT = 0.12;
    spawnRipple((Math.random() * 2 - 1) * 4.4, (Math.random() * 2 - 1) * 4.4, 0.2);
  }
  // 云变暗 + 雨声（静音时不响）
  const cl = 1 - 0.4 * weather.rainAmt - 0.12 * weather.snowAmt;
  matCloud.color.setRGB(cl, cl, Math.min(1, cl + 0.03));
  if (actx && rainGain) rainGain.gain.value = muted ? 0 : weather.rainAmt * 0.05;
}

/* ================= 表情：眼睛（会看鼠标、会眨眼）+ 嘴巴 + 腮红 ================= */
const matEyeWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25 });
const matPupil    = new THREE.MeshStandardMaterial({ color: 0x1d2430, roughness: 0.3 });
const matMouth    = new THREE.MeshStandardMaterial({ color: 0x2b2b33, roughness: 0.35 });
const matCheek    = new THREE.MeshStandardMaterial({ color: 0xff9ecb, roughness: 0.9, transparent: true, opacity: 0.65 });

function makeEye(sign) {
  const center = new THREE.Vector3(sign * 0.30, 0.60, 0.60).normalize().multiplyScalar(1.0);
  const g = new THREE.Group();
  g.position.copy(center);
  const white = new THREE.Mesh(new THREE.SphereGeometry(0.12, 18, 14), matEyeWhite);
  g.add(white);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.052, 12, 10), matPupil);
  g.add(pupil);
  // 眼睛局部坐标系（法线 / 切线），瞳孔沿切面移动
  const n = center.clone().normalize();
  const right = new THREE.Vector3(0, 1, 0).cross(n).normalize();
  const up = n.clone().cross(right).normalize();
  slimeGroup.add(g);
  return { group: g, pupil, n, right, up, base: center };
}
const eyeL = makeEye(-1);
const eyeR = makeEye(1);

function makePool(n, factory) {
  const arr = [];
  for (let i = 0; i < n; i++) {
    const it = factory(i);
    it.mesh.visible = false;
    scene.add(it.mesh);
    arr.push(it);
  }
  return arr;
}
function poolGet(pool) {
  for (const it of pool) if (!it.mesh.visible) return it;
  return null;
}
function updateFloatPool(pool, dt) {
  for (const it of pool) {
    if (!it.mesh.visible) continue;
    it.life += dt / it.dur;
    if (it.life >= 1) { it.mesh.visible = false; continue; }
    it.vel.y -= it.grav * dt;
    it.mesh.position.addScaledVector(it.vel, dt);
    if (it.spin) {
      it.mesh.rotation.x += it.spin * dt;
      it.mesh.rotation.y += it.spin * 0.6 * dt;
    }
    const k = it.grow ? (0.55 + it.life * 0.75) : Math.max(0.05, 1 - it.life);
    it.mesh.scale.setScalar(it.baseS * k);
    if (it.mesh.material) it.mesh.material.opacity = 1 - it.life;
  }
}

function makeBubbleSprite() {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 128;
  const ctx = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  function redraw(text) {
    ctx.clearRect(0, 0, 256, 128);
    ctx.fillStyle = 'rgba(255,255,255,0.96)';
    ctx.strokeStyle = 'rgba(80,120,160,0.9)';
    ctx.lineWidth = 5;
    const r = 32;
    ctx.beginPath();
    ctx.moveTo(30 + r, 14);
    ctx.arcTo(226, 14, 226, 86, r);
    ctx.arcTo(226, 86, 30, 86, r);
    ctx.arcTo(30, 86, 30, 14, r);
    ctx.arcTo(30, 14, 226, 14, r);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 小尾巴
    ctx.beginPath();
    ctx.moveTo(116, 84);
    ctx.lineTo(128, 116);
    ctx.lineTo(142, 84);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillRect(118, 78, 22, 8);
    // 文字
    ctx.fillStyle = '#2c4a66';
    ctx.font = 'bold 34px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 128, 50);
    tex.needsUpdate = true;
  }
  return { sp: sp, redraw: redraw };
}

/* ================= 音效（Web Audio 合成，无外部资源） ================= */
let actx = null, muted = false, keepAlive = null, rainGain = null;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    // 静音保活振荡器：让浏览器认为页面在播放声音，
    // 页面切到后台时定时器不被强节流，动画继续运行
    if (!keepAlive) {
      keepAlive = actx.createOscillator();
      const kg = actx.createGain();
      kg.gain.value = 0.0015;
      keepAlive.frequency.value = 40;
      keepAlive.connect(kg).connect(actx.destination);
      keepAlive.start();
    }
    // 雨声循环（白噪声 + 低通），音量由天气系统控制
    if (!rainGain) {
      const len = Math.floor(actx.sampleRate * 1.2);
      const buf = actx.createBuffer(1, len, actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = actx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      const f = actx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 900;
      rainGain = actx.createGain();
      rainGain.gain.value = 0;
      src.connect(f).connect(rainGain).connect(actx.destination);
      src.start();
    }
  } catch (e) { /* 无音频环境时静默失败 */ }
}
function blip(f0, f1, dur, vol, delay = 0) {
  if (muted || !actx) return;
  try {
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) { /* ignore */ }
}
function splashSound() {
  if (muted || !actx) return;
  try {
    const dur = 0.3;
    const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = actx.createBufferSource();
    src.buffer = buf;
    const f = actx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 900;
    f.Q.value = 0.8;
    const g = actx.createGain();
    g.gain.value = 0.25;
    src.connect(f).connect(g).connect(actx.destination);
    src.start();
  } catch (e) { /* ignore */ }
}

  if (slime.mode !== 'free' || slime.pos.y > GROUND_Y + 0.05 || slime.danceT > 0) return;
  ensureAudio();

  achInc('mega5', 1);
}
function computeHopLeg() {
  const H = slime.hop;
  // 到达绕行点后清掉，继续朝原目标规划
  if (H.waypoint && Math.hypot(H.waypoint.x - slime.pos.x, H.waypoint.z - slime.pos.z) < 0.3) H.waypoint = null;
  const aim = H.waypoint || H.target;
  const dx = aim.x - slime.pos.x;
  const dz = aim.z - slime.pos.z;
  const dist = Math.hypot(dx, dz);
  if (dist < 0.18) {
    if (H.waypoint) { H.waypoint = null; return computeHopLeg(); }
    H.done = true; return;
  }
  let leg = Math.min(1.15, dist);
  // 正前方被障碍物挡住：找切线绕行点，优雅地绕过去继续走
  const hit = segmentToObstacle(slime.pos.x, slime.pos.z, aim.x, aim.z, 0.55);
  if (hit >= 0 && hit < leg) {
    const wrap = pickWaypoint(slime.pos, aim);
    if (wrap) { H.waypoint = wrap; return computeHopLeg(); }
    // 两侧都绕不开（贴着障碍物且目标在障碍物那侧的夹缝）：截短这一段，小磕一下就停
    leg = Math.max(hit - 0.06, 0.1);
    if (hit <= 0.18) H.done = true;
  }
  H.from.copy(slime.pos);
  H.to.set(slime.pos.x + dx / dist * leg, GROUND_Y, slime.pos.z + dz / dist * leg);
  H.h = 0.5 + 0.3 * (leg / 1.15);
  H.t = 0;
  slime.sq.v -= 2.6;
  blip(170 + H.i * 35, 330, 0.09, 0.08);
}
function startHops(target) {
  if (slime.mode === 'grab' || slime.pos.y > 0.6 || slime.danceT > 0 || pet.active) return;
  const d = Math.hypot(target.x - slime.pos.x, target.z - slime.pos.z);
  if (d < 0.35) return;
  slime.mode = 'hop';
  const H = slime.hop;
  // 目标点落在障碍物（树 / 小屋）里时，自动重定向到最近的禁区外
  const safe = nearestOutsidePoint(target.x, target.z, 0.6);
  H.target.set(clamp(safe.x, -BOUND, BOUND), GROUND_Y, clamp(safe.z, -BOUND, BOUND));
  H.waypoint = null;
  H.count = clamp(Math.ceil(d / 1.15) + 3, 3, 12);   // +3 步余量给绕行
  H.i = 0;
  H.done = false;
  computeHopLeg();
}

function updateBabies(dt, t) {
  for (const b of babies) {
    b.prev.copy(b.pos);
    if (b.mode === 'grab') {
      b.vel.x += ((b.target.x - b.pos.x) * 90 - b.vel.x * 11) * dt;
      b.vel.z += ((b.target.z - b.pos.z) * 90 - b.vel.z * 11) * dt;
      const hoverY = 0.85 + Math.sin(t * 3 + 1) * 0.05;
      b.vel.y += ((hoverY - b.pos.y) * 80 - b.vel.y * 9) * dt;
      b.pos.addScaledVector(b.vel, dt);
      b.pos.x = clamp(b.pos.x, -BOUND, BOUND);
      b.pos.z = clamp(b.pos.z, -BOUND, BOUND);
    } else {
      b.vel.y -= 26 * dt;
      b.pos.addScaledVector(b.vel, dt);
      if (b.pos.y <= GROUND_Y) {
        b.pos.y = GROUND_Y;
        const iv = -b.vel.y;
        if (iv > 1.2) { b.vel.y = iv * 0.32; b.sq.v += Math.min(5, iv * 0.9); if (iv > 3) spawnRipple(b.pos.x, b.pos.z, 0.4); }
        else { b.vel.y = 0; b.vel.x *= Math.exp(-6 * dt); b.vel.z *= Math.exp(-6 * dt); }
      }
      for (const ax of ['x', 'z']) {
        if (Math.abs(b.pos[ax]) > BOUND) {
          b.pos[ax] = Math.sign(b.pos[ax]) * BOUND;
          b.vel[ax] *= -0.45;
        }
      }
      // 推出障碍物禁区，防止宝宝钻进树 / 小屋
      pushOutOfObstacles(b.pos, 0.35);
      // 跟随领队（排成小尾巴）
      const L = b.leader;
      if (L) {
        const dx = b.pos.x - L.pos.x, dz = b.pos.z - L.pos.z;
        const d = Math.hypot(dx, dz);
        b.followT -= dt;
        if (d > 0.95 && b.pos.y <= GROUND_Y + 0.01 && b.followT <= 0) {
          b.followT = 0.3;
          const sp = 2.4 + Math.min(d * 0.8, 2);
          b.vel.x = -dx / d * sp;
          b.vel.z = -dz / d * sp;
          b.vel.y = 4.4;
          b.sq.v -= 2;
          if (t - lastBabyBlip > 0.15) { lastBabyBlip = t; blip(480 + Math.random() * 160, 760, 0.07, 0.05); }
        }
      }
    }
    b.effVel.subVectors(b.pos, b.prev).divideScalar(Math.max(dt, 1e-4));
    springUpdate(b.sq, 170, 11, dt);
    b.sq.x = clamp(b.sq.x, -0.35, 0.55);
    const tlx = clamp(-b.effVel.x * 0.04, -0.2, 0.2);
    const tlz = clamp(-b.effVel.z * 0.04, -0.2, 0.2);
    b.lean.x += (tlx - b.lean.x) * (1 - Math.exp(-9 * dt));
    b.lean.z += (tlz - b.lean.z) * (1 - Math.exp(-9 * dt));
    const spd = Math.hypot(b.effVel.x, b.effVel.z);
    const targetYaw = spd > 0.8 ? Math.atan2(b.effVel.x, b.effVel.z) : b.yaw;
    b.yaw = lerpAngle(b.yaw, targetYaw, 1 - Math.exp(-8 * dt));
    const breath = Math.sin(t * 3 + b.pos.x);
    b.g.position.copy(b.pos);
    b.g.rotation.y = b.yaw;
    b.g.scale.set(
      Math.max(0.5, (1 + 0.62 * b.sq.x) * (1 - 0.01 * breath)),
      Math.max(0.45, (1 - 0.85 * b.sq.x) * (1 + 0.02 * breath)),
      Math.max(0.5, (1 + 0.62 * b.sq.x) * (1 - 0.01 * breath))
    );
    // 眨眼 + 夜晚犯困
    if (t > b.nextBlink) { b.blinkT = 0; b.nextBlink = t + 2.5 + Math.random() * 3.5; }
    let ey = 1 - dnState.v * 0.45;
    if (b.blinkT >= 0) {
      b.blinkT += dt;
      const ph = b.blinkT / 0.22;
      if (ph >= 1) b.blinkT = -1;
      else ey *= Math.max(0.08, 1 - 0.95 * Math.sin(ph * Math.PI));
    }
    b.eyeL.scale.y = ey;
    b.eyeR.scale.y = ey;
  }
}

/* ================= 蝴蝶 / 萤火虫更新 ================= */
function updateButterflies(dt, t) {
  for (const bf of butterflies) {
    bf.px = bf.g.position.x;
    bf.pz = bf.g.position.z;
    if (bf.dartT > 0) {
      bf.dartT -= dt;
      bf.g.position.addScaledVector(bf.dartDir, 3.2 * dt);
      bf.lp.rotation.z = Math.sin(t * 40) * 1.1;
      bf.rp.rotation.z = -bf.lp.rotation.z;
      if (bf.dartT <= 0) {
        bf.center.set(bf.g.position.x, 0, bf.g.position.z);
        bf.phase = Math.random() * 10;
      }
    } else {
      const s = bf.speed;
      const px = bf.center.x + Math.sin(t * 0.33 * s + bf.phase) * 1.5;
      const pz = bf.center.z + Math.cos(t * 0.27 * s + bf.phase * 1.3) * 1.5;
      const py = 0.75 + Math.sin(t * 1.1 + bf.phase) * 0.3;
      bf.g.position.set(px, py, pz);
      const flap = Math.sin(t * 11 + bf.phase) * 0.95;
      bf.lp.rotation.z = flap;
      bf.rp.rotation.z = -flap;
    }
    const dx = bf.g.position.x - bf.px, dz = bf.g.position.z - bf.pz;
    if (Math.abs(dx) + Math.abs(dz) > 1e-4) {
      bf.g.rotation.y = lerpAngle(bf.g.rotation.y, Math.atan2(dx, dz), 1 - Math.exp(-6 * dt));
    }
  }
}
function dartButterfly(bf) {
  raycaster.setFromCamera(ndc, camera);
  const d = new THREE.Vector3(raycaster.ray.direction.x, 0, raycaster.ray.direction.z);
  if (d.lengthSq() < 1e-4) d.set(Math.random() - 0.5, 0, Math.random() - 0.5);
  d.normalize();
  bf.dartDir.copy(d);
  bf.dartT = 0.9;
  blip(700, 1250, 0.08, 0.06);
}
function updateFireflies(t) {
  const dn = dnState.v;
  for (const fl of fireflies) {
    const x = fl.cx + Math.sin(t * fl.s1 + fl.ph1) * fl.r;
    const z = fl.cz + Math.cos(t * fl.s2 + fl.ph2) * fl.r;
    const y = fl.h + Math.sin(t * 1.3 + fl.ph2) * 0.2;
    fl.mesh.position.set(x, y, z);
    fl.mesh.material.opacity = dn * (0.25 + 0.75 * Math.pow(Math.max(0, Math.sin(t * 1.8 + fl.ph1 * 3)), 2));
  }
}

/* ================= 昼夜切换 ================= */
const cDayBg = new THREE.Color(0xbfe4f7), cNightBg = new THREE.Color(0x0d1531);
const sunDay = new THREE.Color(0xfff1dc), sunNight = new THREE.Color(0x8fa8ff);
function applyDayNight(dt) {
  const st = dnState;
  st.v += (st.target - st.v) * Math.min(1, dt * 2.2);
  if (Math.abs(st.target - st.v) < 0.002) st.v = st.target;

  scene.environmentIntensity = lerp(0.55, 0.14, dn) * wdim;

/* ================= 指针交互 ================= */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2(-10, -10);
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);        // y = 0
const dragPlane   = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.9);     // y = 0.9
const eyePlane    = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.6);     // y = 0.6
const hitSphere   = new THREE.Sphere(new THREE.Vector3(), 1.05);
const _v = new THREE.Vector3();

const drag = { active: false, moved: false, kind: 'none', obj: null, x: 0, y: 0, t0: 0, id: -1 };

function updateNdc(e) {
  ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
}
function pickTarget() {
  raycaster.setFromCamera(ndc, camera);
  hitSphere.radius = 1.05;
  hitSphere.center.set(slime.pos.x, slime.pos.y + 0.72, slime.pos.z);
  if (raycaster.ray.intersectsSphere(hitSphere)) return { kind: 'slime', obj: null };
  for (const b of babies) {
    hitSphere.radius = 0.55;
    hitSphere.center.set(b.pos.x, b.pos.y + 0.35, b.pos.z);
    if (raycaster.ray.intersectsSphere(hitSphere)) return { kind: 'baby', obj: b };
  }
  if (ball) {
    hitSphere.radius = 0.38;
    hitSphere.center.copy(ball.pos);
    if (raycaster.ray.intersectsSphere(hitSphere)) return { kind: 'ball', obj: ball };
  }
  for (const f of foods) {
    if (f.eaten) continue;
    hitSphere.radius = 0.35;
    hitSphere.center.copy(f.pos);
    if (raycaster.ray.intersectsSphere(hitSphere)) return { kind: 'apple', obj: f };
  }
  for (const bf of butterflies) {
    hitSphere.radius = 0.3;
    hitSphere.center.copy(bf.g.position);
    if (raycaster.ray.intersectsSphere(hitSphere)) return { kind: 'butterfly', obj: bf };
  }
  return { kind: 'none', obj: null };
}

// 用 window 捕获阶段接管事件：点到史莱姆等目标时阻止 OrbitControls
window.addEventListener('pointerdown', (e) => {
  if (e.target !== canvas) return;
  ensureAudio();
  updateNdc(e);
  const hit = pickTarget();
  drag.active = true; drag.moved = false;
  drag.kind = hit.kind; drag.obj = hit.obj;
  drag.x = e.clientX; drag.y = e.clientY; drag.t0 = performance.now(); drag.id = e.pointerId;
  if (hit.kind === 'apple') grabApple(hit.obj);
  if (hit.kind === 'ball') grabBall(hit.obj);
  if (hit.kind !== 'none') e.stopPropagation();
  // slime / baby：先挂起，等移动(抓起)或长按(抚摸)再决定
}, true);

window.addEventListener('pointermove', (e) => {
  updateNdc(e);
  if (!drag.active || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 7) {
    drag.moved = true;
    if (pet.active) pet.active = false;
    if (drag.kind === 'slime' && slime.mode !== 'grab') grabSlime();
    if (drag.kind === 'baby' && drag.obj && drag.obj.mode !== 'grab') grabBaby(drag.obj);
  }
  if (drag.kind === 'slime' && slime.mode === 'grab') {
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(dragPlane, _v)) {
      slime.grabTarget.set(clamp(_v.x, -BOUND, BOUND), 0.95, clamp(_v.z, -BOUND, BOUND));
    }
  } else if (drag.kind === 'baby' && drag.obj && drag.obj.mode === 'grab') {
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(dragPlane, _v)) {
      drag.obj.target.set(clamp(_v.x, -BOUND, BOUND), 0.85, clamp(_v.z, -BOUND, BOUND));
    }
  } else if (drag.kind === 'apple' && drag.obj && drag.obj.mode === 'grab') {
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(dragPlane, _v)) {
      drag.obj.target.set(clamp(_v.x, -BOUND, BOUND), 0.5, clamp(_v.z, -BOUND, BOUND));
    }
  } else if (drag.kind === 'ball' && drag.obj && drag.obj.mode === 'grab') {
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(dragPlane, _v)) {
      drag.obj.target.set(clamp(_v.x, -BOUND, BOUND), 0.5, clamp(_v.z, -BOUND, BOUND));
    }
  }
}, true);

window.addEventListener('pointerup', (e) => {
  if (!drag.active || e.pointerId !== drag.id) return;
  const quick = performance.now() - drag.t0 < 300;
  const k = drag.kind;
  if (k === 'slime') {
    pet.active = false;
    if (slime.mode === 'grab') {
      if (!drag.moved && quick) pokeSlime();
      else releaseSlime();
    } else if (!drag.moved && quick) {
      pokeSlime();
    }
  } else if (k === 'baby' && drag.obj) {
    const b = drag.obj;
    if (b.mode === 'grab') releaseBaby(b);
    else if (!drag.moved && quick) pokeBaby(b);
  } else if (k === 'apple' && drag.obj) {
    drag.obj.mode = 'free';
    blip(400, 260, 0.08, 0.06);
  } else if (k === 'ball' && drag.obj) {
    drag.obj.mode = 'free';
    blip(400, 260, 0.08, 0.06);
  } else if (k === 'butterfly' && drag.obj) {
    if (!drag.moved && quick) dartButterfly(drag.obj);
  } else if (k === 'none') {
    if (!drag.moved && quick) {
      raycaster.setFromCamera(ndc, camera);
      if (raycaster.ray.intersectPlane(groundPlane, _v)) {
        if (inPond(_v.x, _v.z)) fishJump();
        if (plantMode) plantFlower(_v.x, _v.z);
        else startHops(_v);
      }
    }
  }
  drag.active = false; drag.kind = 'none'; drag.obj = null; drag.id = -1;
  canvas.style.cursor = 'default';
}, true);

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// 键盘：空格 = 超级跳，B = 跳舞，Esc = 退出拍照模式

/* ================= 每帧更新：史莱姆 ================= */
const DANCE_NOTES = [523, 659, 784, 1047];
let vertsDeformed = true;   // 顶点当前是否处于形变状态（用于静止时跳过逐顶点更新）
function updateSlime(dt, t) {
  const S = slime;
  S.prev.copy(S.pos);
  S.hopCooldown -= dt;

  if (S.mode === 'grab') {
    // 弹簧跟随指针：滞后 + 回弹，天然带出手感
    S.vel.x += ((S.grabTarget.x - S.pos.x) * 90 - S.vel.x * 11) * dt;
    S.vel.z += ((S.grabTarget.z - S.pos.z) * 90 - S.vel.z * 11) * dt;
    const hoverY = 0.95 + Math.sin(t * 3) * 0.06;
    S.vel.y += ((hoverY - S.pos.y) * 80 - S.vel.y * 9) * dt;
    S.pos.addScaledVector(S.vel, dt);
    S.pos.x = clamp(S.pos.x, -BOUND, BOUND);
    S.pos.z = clamp(S.pos.z, -BOUND, BOUND);
    S.wob1.v += Math.min(Math.hypot(S.vel.x, S.vel.z) * dt * 0.5, 0.02);
  } else if (S.mode === 'hop') {
    const H = S.hop;
    H.t += dt / H.dur;
    if (H.t >= 1) {
      S.pos.set(H.to.x, GROUND_Y, H.to.z);
      landFx(3.4);
      H.i++;
      if (H.done || H.i >= H.count) { S.mode = 'free'; S.vel.set(0, 0, 0); }
      else computeHopLeg();
    } else {
      S.pos.x = lerp(H.from.x, H.to.x, H.t);
      S.pos.z = lerp(H.from.z, H.to.z, H.t);
      S.pos.y = GROUND_Y + 4 * H.h * H.t * (1 - H.t);
      // 低空掠过时推出禁区，避免落进树冠 / 小屋里卡住
      if (S.pos.y < 1.0) pushOutOfObstacles(S.pos, 0.55);
    }
  } else if (S.mode === 'free' && S.danceT > 0) {
    // 跳舞：节奏摆动 + 小跳 + 音符
    S.danceT -= dt;
    const tt = 2.8 - S.danceT;
    S.pos.y = GROUND_Y + Math.abs(Math.sin(tt * 9)) * 0.15;
    S.yaw = S.danceBaseYaw + Math.sin(tt * 9) * 0.6;
    S.danceScale = 1 + 0.06 * Math.sin(tt * 18);
    S.vel.set(0, 0, 0);
    S.noteT -= dt;
    if (S.noteT <= 0) {
      S.noteT = 0.32;
      spawnNote();
      blip(DANCE_NOTES[S.beat % 4], DANCE_NOTES[S.beat % 4] * 1.5, 0.12, 0.07);
      S.beat++;
    }
    if (S.danceT <= 0) { S.pos.y = GROUND_Y; S.danceScale = 1; landFx(2.2); }
  } else { // free：重力 + 弹跳
    // 吃辣椒后：辣到满地乱窜
    if (S.zoomT > 0) {
      S.zoomT -= dt;
      S.zoomDirT -= dt;
      if (S.zoomDirT <= 0 && S.zoomT > 0) {
        S.zoomDirT = 0.24;
        const za = Math.random() * Math.PI * 2;
        S.vel.set(Math.cos(za) * 6.5, 3.2 + Math.random() * 1.2, Math.sin(za) * 6.5);
        spawnDebris(new THREE.Vector3(S.pos.x, S.pos.y + 1.1, S.pos.z), 1, [0xdddddd, 0xbfbfbf], -0.5, 0.4, 0.8);
        blip(480 + Math.random() * 320, 950, 0.07, 0.05);
      }
      if (S.zoomT <= 0) {
        S.wob1.v += 6;
        S.moodT = 1;
        toast('呼……好辣！！🔥');
      }
    }
    S.vel.y -= 26 * dt;
    S.pos.addScaledVector(S.vel, dt);
    if (S.pos.y <= GROUND_Y) {
      S.pos.y = GROUND_Y;
      const iv = -S.vel.y;
      if (iv > 1.4) {
        S.vel.y = iv * 0.36;                    // 弹起
        landFx(iv);
      } else {
        S.vel.y = 0;
        S.vel.x *= Math.exp(-6 * dt);
        S.vel.z *= Math.exp(-6 * dt);
        if (iv > 0.4) landFx(iv * 0.6);
      }
    }
    // 贴地时推出障碍物禁区（树 / 小屋），并沿"墙面"滑动：
    // 去掉撞进障碍物的速度分量，只保留切向速度，避免硬推位置造成的闪现感
    if (S.pos.y < 0.8 && pushOutOfObstacles(S.pos, 0.55)) {
      for (const o of OBSTACLES) {
        const nx = S.pos.x - o.x, nz = S.pos.z - o.z;
        const nd = Math.hypot(nx, nz) || 1e-4;
        if (nd < o.r + 0.62) {
          const vn = (S.vel.x * nx + S.vel.z * nz) / (nd * nd);
          if (vn < 0) { S.vel.x -= vn * nx; S.vel.z -= vn * nz; }
        }
      }
    }
    for (const ax of ['x', 'z']) {              // 边界反弹
      if (Math.abs(S.pos[ax]) > BOUND) {
        S.pos[ax] = Math.sign(S.pos[ax]) * BOUND;
        S.vel[ax] *= -0.45;
        S.wob1.v += 2;
      }
    }
  }

  // 实际速度（hop 模式下也能得到），用于朝向与果冻倾斜
  S.effVel.subVectors(S.pos, S.prev).divideScalar(Math.max(dt, 1e-4));

  // 各弹簧积分
  springUpdate(S.sq, 170, 11, dt);   S.sq.x = clamp(S.sq.x, -0.35, 0.55);
  springUpdate(S.wob1, 85, 3.5, dt); S.wob1.x = clamp(S.wob1.x, -0.085, 0.085);
  springUpdate(S.wob2, 105, 3.2, dt); S.wob2.x = clamp(S.wob2.x, -0.07, 0.07);

  // 非跳舞时才做果冻滞后倾斜 + 朝向
  if (!(S.mode === 'free' && S.danceT > 0)) {
    const tlx = clamp(-S.effVel.x * 0.045, -0.24, 0.24);
    const tlz = clamp(-S.effVel.z * 0.045, -0.24, 0.24);
    S.lean.x += (tlx - S.lean.x) * (1 - Math.exp(-9 * dt));
    S.lean.z += (tlz - S.lean.z) * (1 - Math.exp(-9 * dt));
    const spd = Math.hypot(S.effVel.x, S.effVel.z);
    const targetYaw = spd > 0.8 ? Math.atan2(S.effVel.x, S.effVel.z) : 0;
    S.yaw = lerpAngle(S.yaw, targetYaw, 1 - Math.exp(-8 * dt));
  }

  // 应用位置 / 旋转 / 挤压呼吸缩放（+ 变大 + 跳舞弹跳）
  const breath = Math.sin(t * 2.2);
  slimeGroup.position.copy(S.pos);
  slimeGroup.rotation.y = S.yaw;
  const extra = S.grow * S.danceScale;
  slimeGroup.scale.set(
    Math.max(0.4, (1 + 0.62 * S.sq.x) * (1 - 0.008 * breath) * extra),
    Math.max(0.35, (1 - 0.85 * S.sq.x) * (1 + 0.02 * breath) * extra),
    Math.max(0.4, (1 + 0.62 * S.sq.x) * (1 - 0.008 * breath) * extra)
  );

  // 顶点抖动：沿原始法线叠加两个衰减正弦模态 + 顶部滞后偏移
  // 性能优化：抖动 / 倾斜都趋近 0 时跳过逐顶点更新（静止时不空耗性能）
  const curGeo = slimeMesh.geometry;
  const wobAmp = Math.abs(S.wob1.x) + Math.abs(S.wob2.x);
  const leanAmp = Math.abs(S.lean.x) + Math.abs(S.lean.z);
  const deformed = wobAmp > 0.002 || leanAmp > 0.02;
  if (deformed) {
    const posArr = curGeo.attributes.position.array;
    for (let i = 0; i < posArr.length; i += 3) {
      const bx = basePos[i], by = basePos[i + 1], bz = basePos[i + 2];
      const nx = baseNor[i], ny = baseNor[i + 1], nz = baseNor[i + 2];
      const h = clamp((by + 0.6725) / 1.5725, 0, 1);
      const d = S.wob1.x * Math.sin(t * 13 + by * 2.6 + bx * 1.9 + bz * 1.3)
              + S.wob2.x * Math.sin(t * 17.3 + bx * 2.2 - bz * 1.7);
      const hh = h * h;
      posArr[i]     = bx + nx * d + S.lean.x * hh;
      posArr[i + 1] = by + ny * d;
      posArr[i + 2] = bz + nz * d + S.lean.z * hh;
    }
    curGeo.attributes.position.needsUpdate = true;
    curGeo.computeVertexNormals();
    vertsDeformed = true;
  } else if (vertsDeformed) {
    // 刚从运动进入静止：把顶点恢复成原始形状，之后不再逐帧更新
    curGeo.attributes.position.array.set(basePos);
    curGeo.attributes.position.needsUpdate = true;
    curGeo.computeVertexNormals();
    vertsDeformed = false;
  }

  slimeGroup.updateMatrixWorld(true);
}

let faceHidden = false;   // 某些变身（如 🦆）不显示史莱姆的五官
function updateFace(dt, t) {
  const S = slime;
  const dn = dnState.v;

  // 无脸模式：整张脸藏起来（鸭子等形状）
  if (faceHidden) {
    eyeL.group.visible = eyeR.group.visible = false;
    arcL.visible = arcR.visible = false;
    smile.visible = mouthO.visible = false;
    cheeks.forEach(c => { c.visible = false; });
    return;
  }

  // 嘴巴：咀嚼 > 惊讶 > 心情表情
  if (S.chompT > 0) {
    S.chompT -= dt;
    smile.visible = false;
    mouthO.visible = true;
    mouthO.scale.setScalar(1.5 + 0.45 * Math.sin(t * 38));
    if (S.chompT <= 0) mouthO.scale.setScalar(1);
  } else if (S.moodT > 0) {
    S.moodT -= dt;
    smile.visible = false;
    mouthO.visible = true;
  } else {
    const sad = mood.happy < 28;
    smile.visible = true;
    mouthO.visible = false;
    smile.rotation.z = sad ? 0 : Math.PI;  // ∩ 苦瓜脸 / ∪ 微笑
  }

  // 眼睛：抚摸/开心时眯眯眼；夜晚犯困半闭；平时圆眼+眨眼
  const happyArc = (pet.active || mood.happy > 75) && S.moodT <= 0 && S.chompT <= 0;
  eyeL.group.visible = !happyArc;
  eyeR.group.visible = !happyArc;
  arcL.visible = happyArc;
  arcR.visible = happyArc;

  if (t > S.nextBlink) { S.blinkT = 0; S.nextBlink = t + (2.2 + Math.random() * 3.5) * (1 + dn); }
  let eyeScaleY = 1 - dn * 0.5;
  if (S.blinkT >= 0) {
    S.blinkT += dt;
    const ph = S.blinkT / 0.24;
    if (ph >= 1) { S.blinkT = -1; }
    else eyeScaleY *= Math.max(0.06, 1 - 0.95 * Math.sin(ph * Math.PI));
  }
  eyeL.group.scale.y = Math.max(0.05, eyeScaleY);
  eyeR.group.scale.y = Math.max(0.05, eyeScaleY);

  // 瞳孔跟随鼠标（转到史莱姆本地坐标计算）
  raycaster.setFromCamera(ndc, camera);
  const ok = raycaster.ray.intersectPlane(eyePlane, _v);
  if (!ok) _v.copy(camera.position);
  slimeGroup.worldToLocal(_v);
  _v.sub(new THREE.Vector3(0, 0.7, 0)).normalize();
  const px = clamp(_v.x, -1, 1) * 0.05;
  const py = clamp(_v.y, -1, 1) * 0.045;
  for (const eye of [eyeL, eyeR]) {
    eye.pupil.position.set(
      eye.n.x * 0.082 + eye.right.x * px + eye.up.x * py,
      eye.n.y * 0.082 + eye.right.y * px + eye.up.y * py,
      eye.n.z * 0.082 + eye.right.z * px + eye.up.z * py
    );
  }
}

  g.computeBoundingBox();

      && slime.pos.y <= GROUND_Y + 0.05 && performance.now() - drag.t0 > 420) {
    if (!pet.active) {
      pet.active = true;
      pet.pulse = 0;
      S.sq.v -= 1;
      say('摸摸头～');
      if (!pet.toastShown) { pet.toastShown = true; toast('被摸得好舒服～❤️ 继续按住'); }
    }
  }
  if (pet.active) {
    mood.happy = Math.min(100, mood.happy + dt * 7);
    achInc('pet10', dt);
    pet.pulse -= dt;
    if (pet.pulse <= 0) {
      pet.pulse = 0.26;
      spawnHeart(new THREE.Vector3(
        S.pos.x + (Math.random() - 0.5) * 0.7, S.pos.y + 1.3 + Math.random() * 0.3, S.pos.z + (Math.random() - 0.5) * 0.4));
      blip(90 + Math.random() * 35, 65, 0.13, 0.05);
      S.sq.v -= 0.35;
    }
  } else {
    mood.happy = Math.max(0, mood.happy - dt * 0.35);
  }
  // 下雨天天心情会慢慢变好（史莱姆喜欢雨天）
  if (weather.rainAmt > 0.7) mood.happy = Math.min(100, mood.happy + dt * 0.5);

  // --- 自动去吃食物 ---
  if (S.mode === 'free' && S.pos.y <= GROUND_Y + 0.05 && S.danceT <= 0 && S.chompT <= 0 && !pet.active && S.zoomT <= 0) {
    for (const f of foods) {
      if (f.eaten || !f.resting) continue;
      const d = Math.hypot(f.pos.x - S.pos.x, f.pos.z - S.pos.z);
      if (d < 0.8) { eatFood(f); break; }
      if (d < 8 && S.hopCooldown <= 0) {
        S.hopCooldown = 1.2;
        startHops(f.pos);
        break;
      }
    }
  }

  // --- 摘星挑战：碰到星星就收集，并自动追下一颗 ---
  if (starGame.active && S.mode === 'free' && !pet.active && S.danceT <= 0 && S.chompT <= 0 && S.zoomT <= 0) {
    for (let i = starGame.stars.length - 1; i >= 0; i--) {
      const st = starGame.stars[i];
      const d = Math.hypot(st.mesh.position.x - S.pos.x, st.mesh.position.z - S.pos.z);
      if (d < 0.65 && S.pos.y < 1.1) {
        collectStar(st);
        starGame.stars.splice(i, 1);
      }
    }
    if (starGame.active && starGame.stars.length > 0 && S.pos.y <= GROUND_Y + 0.05 && S.hopCooldown <= 0) {
      let best = null, bd = 99;
      for (const st of starGame.stars) {
        const d = Math.hypot(st.mesh.position.x - S.pos.x, st.mesh.position.z - S.pos.z);
        if (d < bd) { bd = d; best = st; }
      }
      if (best && bd > 0.7 && bd < 9) {
        S.hopCooldown = 1.0;
        startHops(best.mesh.position);
      }
    }
  }

  // --- 没有吃的就去追球玩 ---
  if (ball && ball.mode === 'free' && S.mode === 'free' && S.pos.y <= GROUND_Y + 0.05 &&
      S.danceT <= 0 && S.chompT <= 0 && !pet.active && S.zoomT <= 0 && mood.happy > 35 && !starGame.active) {
    const hasFood = foods.some(f => !f.eaten && f.resting);
    const bd = Math.hypot(ball.pos.x - S.pos.x, ball.pos.z - S.pos.z);
    if (!hasFood && bd > 1.35 && bd < 8 && S.hopCooldown <= 0) {
      // 卡死看门狗：追了 5 秒还没接近到能踢的距离 → 球多半卡在死角，轻推一把让它滚出来
      if (!S.chaseWatch) S.chaseWatch = t;
      if (t - S.chaseWatch > 5) {
        const a = Math.random() * Math.PI * 2;
        ball.vel.x = Math.cos(a) * 3.2; ball.vel.z = Math.sin(a) * 3.2; ball.vel.y = 3.5;
        spawnDebris(ball.pos, 4, SPARKLE_COLORS, 5);
        S.chaseWatch = t;
      }
      S.hopCooldown = 1.0;
      startHops(ball.pos);
    } else if (bd <= 1.35) S.chaseWatch = 0;
  }

  // --- 待机小动作：开心小跳 / 难过叹气 / 夜晚打瞌睡 ---
  S.idleHopT -= dt;
  if (S.idleHopT <= 0) {
    S.idleHopT = 5 + Math.random() * 5;
    if (S.mode === 'free' && S.pos.y <= GROUND_Y + 0.05 && S.danceT <= 0 && !pet.active && S.zoomT <= 0) {
      if (mood.happy > 75) { S.vel.y = 3.2; S.sq.v -= 1.5; blip(330, 520, 0.09, 0.07); }
      else if (mood.happy < 28) { S.sq.v -= 0.9; blip(140, 70, 0.3, 0.06); }
    }
  }
  S.zT -= dt;
  if (S.zT <= 0) {
    S.zT = 3.5 + Math.random() * 2;
    if (dnState.v > 0.6 && S.mode === 'free' && S.pos.y <= GROUND_Y + 0.05 && !pet.active && S.danceT <= 0) spawnZ();
  }

  // --- 消化：慢慢变回原大小 ---
  if (S.grow > 1) S.grow = Math.max(1, S.grow - dt * 0.006);

  // --- 彩虹模式 ---
  if (slimeRainbow) {
    const hue = (t * 0.05) % 1;
    slimeMat.color.setHSL(hue, 0.7, 0.62);
    slimeMat.attenuationColor.setHSL(hue, 0.85, 0.5);
  }
}

<script>

  // —— 🖼️ 举牌牌（拖图片后触发）——

  const sign = document.createElement('div');

  sign.style.cssText = 'position:fixed;z-index:5;display:none;pointer-events:auto;cursor:pointer;transition:opacity .4s ease;' +
    'background:rgba(255,255,255,.95);border-radius:10px;padding:5px;box-shadow:0 4px 14px rgba(60,90,140,.35);';
  const signImg = document.createElement('img');

  sign.appendChild(signImg);

  window.addEventListener('dragover', (e) => { e.preventDefault(); });
  window.addEventListener('drop', (e) => {

      return;
    }
    if (IMG_EXT.has(ext)) {
      const reader = new FileReader();
      reader.onload = () => {
        signUrls.push(reader.result);
        if (signUrls.length > 6) signUrls.shift();
        signIdx = signUrls.length - 1;
        signImg.src = signUrls[signIdx];
        sign.style.display = 'block';
        sign.style.opacity = '1';
        const s = slimeCenter();
        sign.style.left = (s.x - sign.offsetWidth / 2) + 'px';
        sign.style.top = Math.max(s.y - 110, 60) + 'px';
        petTip('🖼️ 举在头顶展示啦！跟随着它～');
      };
      reader.readAsDataURL(f);
      return;
    }
    petTip('😋 ' + f.name + ' 好吃！');
  }););

  // 阻止浏览器打开拖入文件
  window.addEventListener('dragenter', (e) => e.preventDefault());

  // —— 举牌持续跟随史莱姆头顶 ——
  setInterval(() => {
    if (sign.style.display !== 'block' || !signUrls.length) return;
    const s = slimeCenter();
    sign.style.left = (s.x - sign.offsetWidth / 2) + 'px';
    sign.style.top = (s.y - sign.offsetHeight - 12) + 'px';
  }, 100);
})();
</script>
</body>
</html>
