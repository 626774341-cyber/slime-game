<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; background: #fff;
    font-family: "PingFang SC", sans-serif;
    display: flex; gap: 8px; padding: 16px; align-items: center; }
  input { flex: 1; font-size: 15px; padding: 7px 9px; border-radius: 8px;
    border: 2px solid #bcd8ee; outline: none; color: #2c4a66; }
  input:focus { border-color: #54c8ff; }
  button { border: none; background: #54c8ff; color: #fff; border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
  <input id="n" maxlength="6" placeholder="给它取个名">
  <button id="ok">好了</button>
  <script>
    const input = document.getElementById('n');
    input.value = new URLSearchParams(location.search).get('n') || '';
    input.focus(); input.select();
    function go() {
      const v = input.value.trim();
      if (v && window.petApi) window.petApi.setName(v);
      window.close();
    }
    document.getElementById('ok').addEventListener('click', go);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  </script>
</body>
</html>
